<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>KSCL System – Sakuko Vietnam</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#0066cc;--pri-d:#004fa3;--pri-l:#e8f2ff;
  --sb:#1b2a4a;--sb-t:#7a92bc;--sb-h:#253a5e;
  --bg:#f0f2f7;--surface:#fff;--border:#dde3ef;
  --t1:#1a2332;--t2:#6b7a99;--t3:#a8b5cc;
  --ok:#16a34a;--warn:#f59e0b;--err:#dc2626;--info:#0ea5e9;
  --r:8px;--sh:0 2px 12px rgba(0,0,0,.08)
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:14px}
button{cursor:pointer;border:none;outline:none}
input,select,textarea{outline:none;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;font-family:inherit}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,102,204,.12)}

/* LOADING */
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b2a4a 0%,#0d5ea8 100%)}
.ld-logo{width:80px;height:80px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:rgba(255,255,255,.75);font-size:14px}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b2a4a 0%,#0d5ea8 100%)}
.login-card{background:#fff;border-radius:18px;padding:48px 42px;width:430px;max-width:96vw;box-shadow:0 32px 80px rgba(0,0,0,.25)}
.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:36px}
.login-brand-icon{width:52px;height:52px;background:linear-gradient(135deg,#0066cc,#00c6ff);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;flex-shrink:0}
.login-brand h2{font-size:20px;font-weight:800;color:var(--t1);line-height:1.2}
.login-brand p{font-size:12px;color:var(--t2);margin-top:2px}
.login-card h3{font-size:24px;font-weight:700;margin-bottom:6px}
.login-sub{color:var(--t2);font-size:13px;margin-bottom:28px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.fg input{width:100%;padding:11px 14px;font-size:14px}
.btn-login{background:var(--pri);color:#fff;border-radius:9px;padding:13px;font-size:15px;font-weight:700;width:100%;transition:.2s;margin-top:4px}
.btn-login:hover{background:var(--pri-d)}
.err-box{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;color:#dc2626;font-size:13px;margin-bottom:14px}

/* APP SHELL */
#shell{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sb{width:240px;background:var(--sb);color:var(--sb-t);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sb::-webkit-scrollbar{width:4px}.sb::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:2px}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.sb-logo-ic{width:44px;height:44px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 14px rgba(0,0,0,.35)}
.sb-logo h3{color:#fff;font-size:14px;font-weight:800;line-height:1.3}
.sb-logo p{font-size:11px;color:var(--sb-t)}
.sb-user{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.sb-av{width:36px;height:36px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.sb-ui strong{display:block;color:#fff;font-size:13px;line-height:1.4;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ui span{font-size:11px}
.role-pill{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;background:var(--pri-l);color:var(--pri)}
.sb-g{padding:6px 0}
.sb-gl{padding:7px 16px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.28)}
.sb-it{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;color:var(--sb-t);font-size:13.5px;transition:.15s}
.sb-it:hover{background:var(--sb-h);color:#fff}
.sb-it.active{background:var(--sb-h);color:#fff;border-left-color:var(--pri)}
.sb-ic{font-size:17px;width:28px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.sb-ic svg{filter:brightness(0) invert(1);opacity:.72}.sb-it.active .sb-ic svg,.sb-it:hover .sb-ic svg{opacity:1}
.sb-bot{margin-top:auto;border-top:1px solid rgba(255,255,255,.07);padding:6px 0}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.tb-title{font-size:15px;font-weight:700;color:var(--t1);min-width:120px}
.tb-search{flex:1;max-width:300px;position:relative}
.tb-search input{padding:7px 12px 7px 34px;border-radius:18px;background:#f0f2f7;border-color:transparent;width:100%;font-size:13px}
.tb-search input:focus{background:#fff;border-color:var(--pri)}
.tb-s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:14px}
.tb-acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.ico-btn{width:36px;height:36px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t2);cursor:pointer;transition:.15s;position:relative}
.ico-btn:hover{background:#f0f2f7;color:var(--t1)}
.notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--err);border-radius:50%;border:2px solid #fff}
.tb-av{width:36px;height:36px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.content{flex:1;overflow-y:auto;padding:20px}
.content::-webkit-scrollbar{width:6px}.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* GRIDS */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g4,.g3,.g2{grid-template-columns:1fr}}

/* CARD */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px}

/* KPI */
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;border-top:4px solid currentColor;position:relative;overflow:hidden}
.kpi-lb{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.kpi-v{font-size:30px;font-weight:800;line-height:1;color:var(--t1)}
.kpi-u{font-size:14px;font-weight:500;color:var(--t2);margin-left:3px}
.kpi-tr{font-size:11px;margin-top:7px;display:flex;align-items:center;gap:3px}
.tr-ok{color:var(--ok)}.tr-dn{color:var(--err)}
.kpi-bg{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:38px;opacity:.14;display:flex;align-items:center;line-height:1}

/* MODULE GRID */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.mc{background:#fff;border-radius:12px;padding:22px 14px;text-align:center;cursor:pointer;transition:.2s;box-shadow:var(--sh);border:2px solid transparent}
.mc:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.13)}
.mc-ic{width:68px;height:68px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;overflow:visible;position:relative;box-shadow:0 3px 12px rgba(26,37,88,.13)}
.mc-lb{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:3px}
.mc-ds{font-size:11px;color:var(--t2);line-height:1.4}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--pri)}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}

/* TABLE */
.tw{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#f8f9fc;padding:10px 13px;text-align:left;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid #f0f2f7;transition:.1s}
tbody tr:hover{background:#f8f9ff}
tbody td{padding:11px 13px}
tbody tr:last-child{border-bottom:none}

/* BADGE */
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-ok{background:#dcfce7;color:#16a34a}.b-warn{background:#fef9c3;color:#b45309}
.b-err{background:#fee2e2;color:#dc2626}.b-info{background:#e0f2fe;color:#0369a1}
.b-gray{background:#f1f5f9;color:#475569}

/* BTN */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.b-pri{background:var(--pri);color:#fff}.b-pri:hover{background:var(--pri-d)}
.b-ok2{background:var(--ok);color:#fff}.b-ok2:hover{background:#14803a}
.b-out{background:#fff;color:var(--t2);border:1px solid var(--border)}.b-out:hover{border-color:var(--pri);color:var(--pri)}
.b-sm{padding:5px 11px;font-size:12px}
.b-danger{background:#fee2e2;color:#dc2626}.b-danger:hover{background:#fecaca}

/* ALERT */
.alert{border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;font-size:13px}
.a-warn{background:#fffbeb;border:1px solid #fcd34d}.a-err{background:#fef2f2;border:1px solid #fca5a5}
.a-ok{background:#f0fdf4;border:1px solid #86efac}.a-info{background:#f0f9ff;border:1px solid #7dd3fc}
.a-ic{font-size:18px;flex-shrink:0;margin-top:1px}
.a-bd strong{display:block;font-weight:700;margin-bottom:2px}
.a-bd p{color:var(--t2);font-size:12px}

/* CHART */
.chart-box{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
.chart-title{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--t1)}
.chart-wrap{position:relative;height:240px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:480px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 32px 80px rgba(0,0,0,.3)}
.mhdr{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.mhdr h3{font-size:16px;font-weight:700}
.mclose{width:32px;height:32px;border-radius:50%;background:#f0f2f7;border:none;cursor:pointer;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.mbody{padding:20px 24px}
.mfoot{padding:0 24px 20px;display:flex;gap:10px;justify-content:flex-end}

/* DROP ZONE */
.dz{border:2px dashed var(--border);border-radius:10px;padding:32px;text-align:center;cursor:pointer;transition:.2s;background:#fafbff}
.dz:hover,.dz.over{border-color:var(--pri);background:var(--pri-l)}
.dz p{color:var(--t2);font-size:13px;margin-top:10px;line-height:1.5}

/* PROGRESS */
.prog{height:8px;background:#f0f2f7;border-radius:4px;overflow:hidden;margin-top:5px}
.prog-f{height:100%;border-radius:4px;transition:width .4s}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.sec-hdr h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.breadcrumb{font-size:12px;color:var(--t2);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.breadcrumb span{color:var(--pri);cursor:pointer}.breadcrumb span:hover{text-decoration:underline}

/* TOAST */
.tw-wrap{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1a2332;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:tin .3s forwards,tout .3s 3.2s forwards;max-width:320px}
.t-ok{background:#16a34a}.t-err{background:#dc2626}.t-warn{background:#b45309}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}

/* APP KSCL */
.app-log{background:#1e1e2e;border-radius:8px;padding:14px 16px;font-family:Consolas,monospace;font-size:12px;max-height:360px;overflow-y:auto;border:1px solid #333}
.log-l{padding:2px 0;line-height:1.6;color:#c8c8e8;white-space:pre-wrap;word-break:break-all}
.log-l.ok{color:#4ade80}.log-l.err{color:#f87171}.log-l.warn{color:#fbbf24}.log-l.head{color:#7c6af7;font-weight:700}
.btn-upload{background:var(--pri-l);color:var(--pri);border:1px dashed var(--pri);border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-upload:hover{background:var(--pri);color:#fff}
.btn-run{background:#16a34a;color:#fff;border-radius:7px;padding:9px 20px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:.15s}
.btn-run:hover{background:#14803a}
.btn-back{background:#f1f5f9;color:var(--t2);border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s}
.btn-back:hover{background:#e2e8f0;color:var(--t1)}

/* GUIDE ACCORDION */
.guide-acc{border:1px solid #dde5ff;border-radius:10px;margin-bottom:16px;overflow:hidden}
.guide-tog{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 16px;background:#f0f4ff;border:none;cursor:pointer;font-size:13.5px;font-weight:600;color:#3730a3;text-align:left;gap:8px}
.guide-tog:hover{background:#e8eeff}
.guide-body{padding:16px 18px;background:#fff;border-top:1px solid #dde5ff}
.guide-step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.guide-num{min-width:22px;height:22px;border-radius:50%;background:#4f46e5;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.guide-img{max-width:100%;border:1px solid var(--border);border-radius:8px;display:block;margin:8px 0}
.guide-img-ph{border:2px dashed #c7d2fe;border-radius:8px;padding:18px;text-align:center;color:#818cf8;font-size:12.5px;margin:8px 0;background:#fafbff}
.guide-dl{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-size:13px;font-weight:500;text-decoration:none;border:1px solid #bfdbfe;margin:4px 4px 0 0}
.guide-dl:hover{background:#dbeafe;color:#1e40af}
.guide-note{background:#fefce8;border-left:3px solid #fcd34d;padding:8px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:#92400e;margin:10px 0}
.guide-sep{height:1px;background:#e8eeff;margin:12px 0}
.fi{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;background:#fff;color:var(--t1)}
.fi:focus{border-color:#4f46e5}
.fi-sm{width:80px;text-align:center}
.fi-lbl{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
.qcd-sec-hdr{background:linear-gradient(90deg,#4f46e5,#6366f1);color:#fff;padding:12px 18px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-radius:10px 10px 0 0}
.qcd-sec-hdr:hover{background:linear-gradient(90deg,#4338ca,#4f46e5)}
.qcd-sec-body{padding:18px 20px;background:#fff;border:1px solid #e0e7ff;border-top:none;border-radius:0 0 10px 10px}
.qcd-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qcd-num{min-width:22px;height:22px;border-radius:50%;background:#4f46e5;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qcd-saved{background:#dcfce7;border:1px solid #86efac;color:#15803d;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;display:none}
.guide-tag{display:inline-block;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:4px}

/* TREE EDITOR */
.tree-ed{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
.te-bar{padding:10px 14px;background:#f8f9fc;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.te-row{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:7px;margin:2px 4px;transition:.15s;cursor:pointer}
.te-row:hover{background:#f0f2ff}
.te-arr{font-size:10px;color:var(--t2);width:16px;text-align:center;transition:transform .15s;flex-shrink:0}
.te-arr.o{transform:rotate(90deg)}.te-arr.h{visibility:hidden}
.te-ico{font-size:16px;flex-shrink:0}
.te-lbl{flex:1;font-size:13.5px;color:var(--t1)}
.te-act{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0}
.te-row:hover .te-act{opacity:1}
.ta-btn{width:26px;height:26px;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:.15s}
.ta-add{background:#dcfce7;color:#16a34a}.ta-add:hover{background:#bbf7d0}
.ta-del{background:#fee2e2;color:#dc2626}.ta-del:hover{background:#fecaca}
.ta-ren{background:#e0f2fe;color:#0284c7}.ta-ren:hover{background:#bae6fd}
.te-children{padding-left:20px;border-left:2px dashed #e8f2ff;margin-left:14px}
.te-empty-node{padding:10px 16px;color:var(--t3);font-size:12px;font-style:italic}
.te-leaf-content{padding:10px 16px 10px 46px;font-size:13px;color:var(--t2);border-top:1px solid #f5f6fa}

/* MISC */
.divider{height:1px;background:var(--border);margin:18px 0}
.empty-state{text-align:center;padding:40px 20px;color:var(--t2)}
.empty-state .es-ic{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:13px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.checklist-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0f2f7;font-size:13.5px;cursor:pointer}
.checklist-item input[type=checkbox]{width:17px;height:17px;flex-shrink:0;cursor:pointer;accent-color:var(--pri)}
.checklist-item.done{color:var(--t3);text-decoration:line-through}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f5f6fa;font-size:13px}
.stat-row:last-child{border:none}
.stat-row .label{color:var(--t2)}
.stat-row .value{font-weight:700;color:var(--t1)}

.ob-acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.ob-acc-body.open{max-height:9999px}
.ob-chevron{transition:transform .25s;display:inline-block}
.ob-acc-btn.open .ob-chevron{transform:rotate(180deg)}
.ob-role-btn{transition:all .18s;cursor:pointer;border:2px solid var(--border)}
.ob-role-btn:hover{border-color:var(--pri);background:#eff6ff}
.ob-role-btn.on{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-color:#2563eb;box-shadow:0 4px 14px rgba(37,99,235,.28)}
.ob-task-row{transition:background .12s}
.ob-task-row:hover{background:#f0f7ff}

    window.history.replaceState({},'',window.location.pathname);

auth.onAuthStateChanged(async u=>{
  if(u && u.isAnonymous){ await auth.signOut(); return; }
  if(u){
    S.user=u;
    try{
      const snap=await db.ref(`profiles/${u.uid}`).get();
      if(snap.exists()){
        S.profile=snap.val();
        if(!S.profile.role||!ROLES[S.profile.role]){
          S.profile.role=ADMIN_EMAILS.includes(u.email)?'superadmin':'viewer';
          db.ref(`profiles/${u.uid}/role`).set(S.profile.role);
        }
        go('dashboard');window.chatShowFab?.(true);
      } else {
        // New user — auto-create from Lark if available, else show form
        const lark=S.pendingLarkUser;
        S.pendingLarkUser=null;
        if(lark&&lark.email===u.email){
          S.profile={name:lark.name,email:lark.email,role:ADMIN_EMAILS.includes(lark.email)?'superadmin':'viewer',dept:'',phone:'',createdAt:Date.now(),larkId:lark.open_id};
          await db.ref(`profiles/${u.uid}`).set(S.profile);
          go('dashboard');window.chatShowFab?.(true);
        } else {
          S.profile={name:'',email:u.email,role:ADMIN_EMAILS.includes(u.email)?'superadmin':'viewer',dept:'',phone:'',createdAt:Date.now()};

          name: ps.name || ps.email,

function _flushQCSaves(){
  // Gọi trước khi DOM bị render lại — lưu ngay nếu có pending timer
  if(_qcSaveT['qcdt-saved']){
    clearTimeout(_qcSaveT['qcdt-saved']);delete _qcSaveT['qcdt-saved'];
    if(S.page==='qc'&&S.tab==='Đổi trả')qcDTSave(null);
  }
  if(_qcSaveT['qcd-diem-saved']){
    clearTimeout(_qcSaveT['qcd-diem-saved']);delete _qcSaveT['qcd-diem-saved'];
    if(S.page==='qc'&&S.tab==='Chấm điểm dịch vụ')qcDiemSave(null);
  }
}
function go(page,tab=''){
  if(page==='login'||page==='loading'){S.page=page;S.tab=tab;render();return;}
  if(!canAccess(page)){toast('Bạn không có quyền truy cập mục này','t-warn');return;}
  _flushQCSaves(); // Flush pending auto-saves TRƯỚC KHI DOM bị thay thế
  S.page=page;S.tab=tab||'';
  destroyCharts(); render();
}

function destroyCharts(){Object.values(S.charts).forEach(c=>{try{c.destroy()}catch(e){}});S.charts={};}
function dashFilter(from,to){
  // Clamp to available months
  S.dashFrom=from;
  S.dashTo=to>=from?to:from;
  go('dashboard');
}

function rDashboard(){
  const acc=MODS.filter(m=>m.id!=='dashboard'&&canAccess(m.id));
  const now=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  // ── Đổi Date data ──
  if(!S.dateCache){try{S.dateCache=JSON.parse(localStorage.getItem('lark_date_cache')||'null');}catch(e){}}
  const DC=S.dateCache;
  const DM=DC?.monthly?.length?DC.monthly:[
    {t:'T01',dt:28381886851,gv:254575167,tv:141209700,huy:913000,cp:113365467,dinhmuc:59601962,conlai:169951686},
    {t:'T02',dt:27166945070,gv:305335244,tv:175740700,huy:13973000,cp:129594544,dinhmuc:57050584,conlai:228978156},
    {t:'T03',dt:21089532535,gv:270817077,tv:210663800,huy:56046000,cp:60153277,dinhmuc:44288018,conlai:212845656},
    {t:'T04',dt:19107191653,gv:433003826,tv:295402950,huy:20985000,cp:137600876,dinhmuc:40125102,conlai:243188156},
    {t:'T05',dt:17621137715,gv:497596584,tv:342066250,huy:22713000,cp:155530334,dinhmuc:37004389,conlai:266052256},
  ];
  const DS=DC?.stores?.length?DC.stores:[];
  // ── KK caches (load sớm để tính allDataMonths) ──
  if(!S.tonAmCache){try{S.tonAmCache=JSON.parse(localStorage.getItem('tonam_cache')||'null');}catch(e){}}
  if(!S.bbkkCache){try{S.bbkkCache=JSON.parse(localStorage.getItem('bbkk_cache')||'null');}catch(e){}}
  if(!S.xhCache){try{S.xhCache=JSON.parse(localStorage.getItem('xuathuy_cache')||'null');}catch(e){}}
  const _TA=S.tonAmCache,_BB=S.bbkkCache,_XH=S.xhCache;
  const _xhYear=Object.keys(_XH?.data||{}).sort().pop();
  // ── Union months từ tất cả nguồn dữ liệu ──
  const _allM=[...new Set([
    ...DM.map(r=>r.t),
    ...Object.keys(_TA?.months||{}),
    ...(_xhYear?Object.keys(_XH.data[_xhYear]):[] ),
    ...(_BB?.t1||[]).map(r=>`T${String(r.thang).padStart(2,'0')}`)
  ])].filter(t=>/^T\d{2}$/.test(t)).sort();
  // ── Date range filter ──
  const _pF=n=>'T'+String(n).padStart(2,'0');
  const _isAll=!S.dashFrom||(!S.dashTo)||(S.dashFrom===1&&S.dashTo===12);
  const _dFrom=_pF(S.dashFrom||1);
  const _dTo=_pF(S.dashTo||12);
  const DMF=DM.filter(r=>r.t>=_dFrom&&r.t<=_dTo);
  const DMsrc=_isAll?DM:(DMF.length?DMF:DM);
  const isSingleM=S.dashFrom===S.dashTo&&S.dashFrom>0;
  const noDateData=isSingleM&&DMF.length===0;
  const totDT=DMsrc.reduce((a,r)=>a+r.dt,0);
  const totCP=DMsrc.reduce((a,r)=>a+(r.gv-r.tv),0);
  const tonDG=DMsrc[DMsrc.length-1].conlai||0;
  const tlDate=totDT>0?(totCP-tonDG)/totDT:0;
  const NGUONG_DATE=0.0021;
  const ebitDate=(tlDate-NGUONG_DATE)*totDT;
  const dateOk=tlDate<=NGUONG_DATE;
  // ── QC data — ưu tiên qcOvData (dữ liệu thật từ module QC), fallback qcExecData ──
  const qov=S.qcOvData;
  const qd=S.qcExecData;
  const qovRows=qov?.diem&&Array.isArray(qov.diem.rows)?qov.diem.rows:[];
  const qovTotMax=qovRows.reduce((s,r)=>s+(parseFloat(r.max)||0),0);
  const qovTotThuc=qovRows.reduce((s,r)=>s+(parseFloat(r.thuc)||0),0);
  const hasQOV=qovTotMax>0;
  const hasQD=!hasQOV&&qd&&qd.s1_tongluot>0;
  const qcScore=hasQOV?qovTotThuc/qovTotMax*100:hasQD?(qd.s3_diemTB||0):0;
  const qcOk=qcScore>=90;
  const qcSTDuoi85=hasQOV?qovRows.filter(r=>{const mx=parseFloat(r.max),tx=parseFloat(r.thuc);return mx>0&&tx/mx<0.85;}):[];
  const qcSTDuoi90=hasQOV?qovRows.filter(r=>{const mx=parseFloat(r.max),tx=parseFloat(r.thuc);return mx>0&&tx/mx>=0.85&&tx/mx<0.90;}):[];
  const qcSTLoi=hasQOV?qcSTDuoi85.length+qcSTDuoi90.length:hasQD?qd.s3_soSTLoi:0;
  const qcSTTotal=hasQOV?qovRows.length:hasQD?qd.s3_tongST:0;
  const qovDT=qov?.doitra||{};const qovSTDT=qovDT.st||{};const qovCVSDT=qovDT.cvs||{};
  const qcTongDoiTra=hasQOV?((parseFloat(qovSTDT.tongDon)||0)+(parseFloat(qovCVSDT.tongDon)||0)):hasQD?qd.s2_tongdon:0;
  const qovGL=qov?.gianlam||{};
  const qcGLCGT=hasQOV?((qovGL.dk?.cgt||0)+(qovGL.ctkm?.cgt||0)):0;
  const qovBB=hasQOV&&Array.isArray(qov.bienbans)?qov.bienbans:[];
  const qovLoiHM=qov?.diem&&Array.isArray(qov.diem.loiHM)?qov.diem.loiHM:[];
  const qcHasData=hasQOV||hasQD;
  const qcMonth=S.qcOvMonth||S.qcExecMonth||'';
  const qcYear=S.qcOvYear||S.qcExecYear||'2026';
  const qcLabel=qcMonth?'T'+qcMonth+'/'+qcYear:'';
  // ── KK data — dùng cache đã load từ trên ──
  const TA=_TA,BB=_BB,XH=_XH;
  const kkSrcs=[['Tồn âm',!!TA],['Biên bản KK',!!BB],['Xuất hủy',!!XH],['Đổi Date',!!DC]];
  const kkNSrc=kkSrcs.filter(s=>s[1]).length;
  const taMonths=Object.keys(TA?.months||{}).sort();
  const kkM=taMonths[taMonths.length-1]||DMsrc[DMsrc.length-1]?.t||'T07';
  const kkRev=TA?.revenue||{};
  const xhYear=Object.keys(XH?.data||{}).sort().pop();
  const bbYear=Math.max(0,...(BB?.t1||[]).map(r=>r.nam||0))||2026;
  // ── Khi "Tất cả": tổng hợp mọi tháng; khi chọn tháng: dùng tháng đó hoặc gần nhất ──
  let kkDT,taVal,taPct,xhVal,xhPct,ddPct,bbRows,bbCnt,bbDenBu,kkLabel,taData=null;
  if(_isAll){
    // Aggregate tất cả tháng
    kkDT=Object.values(kkRev).reduce((s,v)=>s+v,0);
    taVal=taMonths.reduce((s,mo)=>s+(TA?.months?.[mo]?.totalValue||0),0);
    taPct=kkDT>0&&taVal>0?taVal/kkDT*100:null;
    xhVal=xhYear&&XH?.data?.[xhYear]?Object.values(XH.data[xhYear]).reduce((s,d)=>s+(d?.value||0),0):0;
    xhPct=kkDT>0&&xhVal>0?xhVal/kkDT*100:null;
    const ddTotDT=DM.reduce((s,r)=>s+r.dt,0),ddTotCP=DM.reduce((s,r)=>s+(r.gv-r.tv-r.conlai),0);
    ddPct=ddTotDT>0?ddTotCP/ddTotDT*100:null;
    bbRows=(BB?.t1||[]).filter(r=>r.nam===bbYear);
    kkLabel='T01→'+kkM;
  } else {
    // Tháng đơn — chọn tháng từ dashFrom hoặc kkM
    const selM=isSingleM?_pF(S.dashFrom):kkM;
    kkDT=kkRev[selM]||0;
    taData=TA?.months?.[selM]||null;
    taVal=taData?.totalValue||0; taPct=kkDT>0&&taVal>0?taVal/kkDT*100:null;
    const xhData=xhYear?XH?.data?.[xhYear]?.[selM]:null;
    xhVal=xhData?.value||0; xhPct=kkDT>0&&xhVal>0?xhVal/kkDT*100:null;
    const ddData=(DC?.monthly||[]).find(r=>r.t===selM)||null;
    ddPct=ddData&&ddData.dt>0?ddData.cp/ddData.dt*100:null;
    bbRows=(BB?.t1||[]).filter(r=>r.thang===+selM.slice(1)&&r.nam===bbYear);
    kkLabel=selM;
  }
  bbCnt=bbRows.length; bbDenBu=bbRows.reduce((s,r)=>s+Math.abs(r.denBu||0),0);
  // Health score
  const kkSc=[];
  if(taPct!=null)kkSc.push([taPct<=5?100:taPct<=10?80:taPct<=15?55:taPct<=20?30:10,35]);
  if(ddPct!=null)kkSc.push([ddPct<=0.21?100:ddPct<=0.3?70:ddPct<=0.5?45:20,25]);
  if(xhPct!=null)kkSc.push([xhPct<=0.3?100:xhPct<=0.5?80:xhPct<=1?50:20,20]);
  if(bbCnt>0||bbDenBu>0)kkSc.push([bbDenBu<=0?100:bbDenBu<5e6?70:bbDenBu<2e7?45:20,20]);
  const kkTotalW=kkSc.reduce((s,x)=>s+x[1],0);
  const kkHealth=kkSc.length>=2?Math.round(kkSc.reduce((s,x)=>s+x[0]*x[1],0)/kkTotalW):null;
  const kkGrade=kkHealth==null?['—','#9ca3af']:kkHealth>=85?['A','#16a34a']:kkHealth>=70?['B','#65a30d']:kkHealth>=55?['C','#f97316']:['D','#dc2626'];
  const kkHasData=kkNSrc>=1;
  // ── Cross-risk: ST xuất hiện cả QC xấu + KK xấu ──
  const crossRisk={};
  const addCR=(name,src,detail)=>{if(!name)return;const k=name.trim().replace(/^ST\s*/i,'');if(!crossRisk[k])crossRisk[k]={srcs:{}};crossRisk[k].srcs[src]=detail;};
  qcSTDuoi85.forEach(r=>{const nm=(r.st||'').replace(/^Siêu thị\s*/i,'');const p=parseFloat(r.max)>0?(parseFloat(r.thuc)/parseFloat(r.max)*100).toFixed(1)+'%':'';addCR(nm,'qc','Điểm '+p);});
  (taData?.stores||[]).slice(0,10).forEach(s=>addCR(s.ten,'ta','Tồn âm '+(s.value>=1e6?(s.value/1e6).toFixed(1)+'M':Math.round(s.value/1e3)+'K')));
  DS.filter(s=>s.cb===1).slice(0,10).forEach(s=>addCR(s.s,'dd','Đổi date '+(s.tl*100).toFixed(2)+'%'));
  bbRows.filter(r=>(r.denBu||0)>0).forEach(r=>addCR(r.tenST,'bb','Đền bù '+(r.denBu>=1e6?(r.denBu/1e6).toFixed(1)+'M':Math.round(r.denBu/1e3)+'K')));
  const crossRiskArr=Object.entries(crossRisk).filter(([,v])=>Object.keys(v.srcs).length>=2).sort((a,b)=>Object.keys(b[1].srcs).length-Object.keys(a[1].srcs).length);
  // ── Helpers ──
  const fM=n=>(n/1e6).toFixed(1)+'M';
  const fP=n=>(n*100).toFixed(2)+'%';
  const fMil=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e9?s+(a/1e9).toFixed(2)+'B':a>=1e6?s+(a/1e6).toFixed(0)+'M':a>=1e3?s+(a/1e3).toFixed(0)+'K':String(n);};
  const fmtV=v=>Math.abs(v)>=1e9?(v/1e9).toFixed(2)+' tỷ':Math.abs(v)>=1e6?(v/1e6).toFixed(1)+' tr':Math.abs(v)>0?Math.round(v/1e3)+'k':'—';
  // CURR_M = tháng mới nhất trong TẤT CẢ nguồn dữ liệu (không chỉ date)
  const CURR_M=isSingleM?_pF(S.dashFrom):(_allM[_allM.length-1]||DMsrc[DMsrc.length-1]?.t||'T07');
  const FIRST_M=_isAll?(_allM[0]||DMsrc[0]?.t||'T01'):_pF(S.dashFrom||1);
  const rangeLabel=isSingleM?CURR_M:(_isAll?(FIRST_M===CURR_M?CURR_M:FIRST_M+'→'+CURR_M):FIRST_M+'→'+_pF(S.dashTo||12));
  const ytdOk=tlDate<=NGUONG_DATE;
  const totCPnet=totCP-tonDG;
  const mTL=DMsrc.map(r=>r.dt>0?(r.gv-r.tv-r.conlai)/r.dt:0);
  const mAbove=DMsrc.filter((_,i)=>mTL[i]>NGUONG_DATE);
  const lastTL=mTL[mTL.length-1]||0;
  const prevTL=mTL.length>=2?mTL[mTL.length-2]:null;
  const dateTrendDelta=prevTL!==null?lastTL-prevTL:0;
  const alertStores=DS.filter(s=>s.cb===1).sort((a,b)=>b.tl-a.tl);
  const totHuy=DMsrc.reduce((a,r)=>a+(r.huy||0),0);
  const tlLabel=t=>`<span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:9px;background:${t?'#dcfce7':'#fee2e2'};color:${t?'#15803d':'#dc2626'}">${t?'✅ Đạt':'⚠️ Cần cải thiện'}</span>`;
  const _nextM=parseInt(CURR_M.slice(1))+1;
  const _nextMLabel='T'+(_nextM<=12?_nextM:1);
  // ── Executive summary bullets ──
  const sbArr=[
    qcHasData?{ok:qcOk,txt:qcOk
      ?`<strong>QC dịch vụ ${qcScore.toFixed(1)}%</strong> (${qcSTTotal} ST) — ${qcSTLoi>0?`${qcSTLoi} ST dưới ngưỡng`:'toàn bộ ST đạt chuẩn'}. Đổi trả: ${qcTongDoiTra} đơn${qcGLCGT>0?`, phát hiện <strong>${qcGLCGT} gian lận</strong>`:''}.`
      :`<strong>Cảnh báo QC ${qcScore.toFixed(1)}%</strong> — ${qcSTDuoi85.length} ST dưới 85%${qcSTDuoi85.length?': '+qcSTDuoi85.slice(0,3).map(r=>(r.st||'').replace(/^Siêu thị\s*/i,'')).join(', '):''}. Cần kiểm tra đột xuất ngay.`}
    :{ok:null,txt:'QC dịch vụ: chưa có dữ liệu — vào <strong>QC → Tổng quan</strong> để tải.'},

      ?`Đổi/Hủy date YTD <strong>${fP(tlDate)}</strong> — trong ngưỡng 0.21%. CP lũy kế: <strong>${fMil(totCPnet)}₫</strong>.`
      :`Đổi/Hủy date YTD <strong>${fP(tlDate)}</strong> — vượt ngưỡng, <strong>${mAbove.length}/${DM.length} tháng</strong> quá hạn. EBIT ước tính: <strong>~${fM(Math.abs(ebitDate))}₫</strong>.`},

/* ══ BÁO CÁO TỔNG QUAN KIỂM KÊ — gộp Tồn âm + BBKK + Xuất hủy + Đổi Date ══ */
function rKKOv(){
  // Nạp 4 nguồn cache
  if(!S.tonAmCache){try{S.tonAmCache=JSON.parse(localStorage.getItem('tonam_cache')||'null');}catch(e){}}
  if(!S.bbkkCache){try{S.bbkkCache=JSON.parse(localStorage.getItem('bbkk_cache')||'null');}catch(e){}}
  if(!S.xhCache){try{S.xhCache=JSON.parse(localStorage.getItem('xuathuy_cache')||'null');}catch(e){}}
  if(!S.dateCache){try{S.dateCache=JSON.parse(localStorage.getItem('lark_date_cache')||'null');}catch(e){}}
  const TA=S.tonAmCache,BB=S.bbkkCache,XH=S.xhCache,DD=S.dateCache;
  const srcs=[['Tồn âm',!!TA],['Biên bản KK',!!BB],['Xuất hủy',!!XH],['Đổi Date',!!DD]];
  const nSrc=srcs.filter(s=>s[1]).length;
  const syncBar=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <span style="font-size:12px;color:var(--t2)">${srcs.map(([n,ok])=>`<span style="margin-right:10px">${ok?'✅':'⚠️'} ${n}</span>`).join('')}</span>
    <button onclick="syncKKAll(this)" style="background:#1a2558;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer">🔄 Đồng bộ tất cả</button>
  </div>`;
  if(!nSrc)return`<div class="card">${syncBar}<div style="text-align:center;padding:32px 0"><div style="font-size:48px;margin-bottom:10px">📊</div><p style="color:var(--t2);font-size:13px">Bấm <strong>Đồng bộ tất cả</strong> để tải 4 nguồn dữ liệu (Tồn âm · Biên bản KK · Xuất hủy · Đổi Date).</p></div></div>`;

  const fmtV=v=>Math.abs(v)>=1e9?(v/1e9).toFixed(2)+' tỷ':Math.abs(v)>=1e6?(v/1e6).toFixed(1)+' tr':Math.abs(v)>0?Math.round(v/1e3)+'k':'—';
  const fmtB=v=>v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(0)+'M':'—';
  const mNames={T01:'Tháng 1',T02:'Tháng 2',T03:'Tháng 3',T04:'Tháng 4',T05:'Tháng 5',T06:'Tháng 6',T07:'Tháng 7',T08:'Tháng 8',T09:'Tháng 9',T10:'Tháng 10',T11:'Tháng 11',T12:'Tháng 12'};

  // Danh sách tháng có dữ liệu (hợp 3 nguồn theo tháng)
  const taM=Object.keys(TA?.months||{});
  const xhY=Object.keys(XH?.data||{}).sort().pop();
  const xhM=xhY?Object.keys(XH.data[xhY]):[];
  const ddM=(DD?.monthly||[]).map(r=>r.t);
  const months=[...new Set([...taM,...xhM,...ddM])].sort();
  // Default: tháng mới nhất có tồn âm + ít nhất 1 nguồn khác (xuất hủy / đổi date / bbkk)
  const bbM=new Set((BB?.t1||[]).map(r=>`T${String(r.thang).padStart(2,'0')}`));
  const xhSet=new Set(xhM),ddSet=new Set(ddM);
  const bestM=[...taM].sort().reverse().find(mo=>xhSet.has(mo)||ddSet.has(mo)||bbM.has(mo))||taM.sort().pop()||months[months.length-1]||'';
  if(!S.kkOvMonth||(S.kkOvMonth!=='ALL'&&!months.includes(S.kkOvMonth)))S.kkOvMonth=bestM;
  const m=S.kkOvMonth;
  const isAll=m==='ALL';
  const rev=TA?.revenue||{};

  // ── Số liệu tháng chọn (hoặc tổng hợp nếu ALL) ──
  const bbYear=Math.max(0,...(BB?.t1||[]).map(r=>r.nam||0))||2026;
  let dt,taVal,taPct,xhVal,xhPct,ddPct,ta,xh,dd,bbRows,bbCnt,bbDenBu,bbCL;
  if(isAll){
    dt=months.reduce((s,mo)=>s+(rev[mo]||0),0);
    taVal=months.reduce((s,mo)=>s+(TA?.months?.[mo]?.totalValue||0),0);
    taPct=dt>0&&taVal>0?taVal/dt*100:null;
    xhVal=xhY?months.reduce((s,mo)=>s+(XH?.data?.[xhY]?.[mo]?.value||0),0):0;
    xhPct=dt>0&&xhVal>0?xhVal/dt*100:null;
    const ddAll=DD?.monthly||[];
    const ddTotDT=ddAll.reduce((s,r)=>s+r.dt,0),ddTotCP=ddAll.reduce((s,r)=>s+r.cp,0);
    dd=ddTotDT>0?{dt:ddTotDT,cp:ddTotCP}:null;
    ddPct=dd&&dd.dt>0?dd.cp/dd.dt*100:null;
    bbRows=(BB?.t1||[]).filter(r=>r.nam===bbYear);
    ta=null; xh=null;
  } else {
    dt=rev[m]||0;
    ta=TA?.months?.[m]||null;
    taVal=ta?.totalValue||0; taPct=dt>0&&taVal>0?taVal/dt*100:null;
    xh=xhY?XH?.data?.[xhY]?.[m]:null;
    xhVal=xh?.value||0; xhPct=dt>0&&xhVal>0?xhVal/dt*100:null;
    dd=(DD?.monthly||[]).find(r=>r.t===m)||null;
    ddPct=dd&&dd.dt>0?dd.cp/dd.dt*100:null;
    bbRows=(BB?.t1||[]).filter(r=>r.thang===+m.slice(1)&&r.nam===bbYear);
  }
  bbCnt=bbRows.length;
  bbDenBu=bbRows.reduce((s,r)=>s+Math.abs(r.denBu||0),0);
  bbCL=bbRows.reduce((s,r)=>s+Math.abs(r.clMinus||0),0);

  // ── Điểm sức khỏe tồn kho (0-100) ──
  const sc=[];
  if(taPct!=null)sc.push([taPct<=5?100:taPct<=10?80:taPct<=15?55:taPct<=20?30:10,35,'Tồn âm']);
  if(ddPct!=null)sc.push([ddPct<=0.21?100:ddPct<=0.3?70:ddPct<=0.5?45:20,25,'Đổi date']);
  if(xhPct!=null)sc.push([xhPct<=0.3?100:xhPct<=0.5?80:xhPct<=1?50:20,20,'Xuất hủy']);
  if(bbCnt>0||bbDenBu>0)sc.push([bbDenBu<=0?100:bbDenBu<5e6?70:bbDenBu<2e7?45:20,20,'Biên bản KK']);
  const totalW=sc.reduce((s,x)=>s+x[1],0);
  const health=sc.length>=2?Math.round(sc.reduce((s,x)=>s+x[0]*x[1],0)/totalW):null;
  const grade=health==null?['—','#9ca3af']:health>=85?['A','#16a34a']:health>=70?['B','#65a30d']:health>=55?['C','#f97316']:['D','#dc2626'];

  // ── Xu hướng theo tháng ──
  const trend=months.map(mo=>{
    const _dt=rev[mo]||0;
    const _ta=TA?.months?.[mo]?.totalValue||0;
    const _xh=xhY?(XH?.data?.[xhY]?.[mo]?.value||0):0;
    const _dd=(DD?.monthly||[]).find(r=>r.t===mo);
    const _bb=(BB?.t1||[]).filter(r=>r.thang===+mo.slice(1)&&r.nam===bbYear);
    return {mo,dt:_dt,ta:_ta,taP:_dt>0?_ta/_dt*100:null,xh:_xh,xhP:_dt>0?_xh/_dt*100:null,
      ddCp:_dd?.cp||0,ddP:_dd&&_dd.dt>0?_dd.cp/_dd.dt*100:null,bbCnt:_bb.length,bbDB:_bb.reduce((s,r)=>s+(r.denBu||0),0)};
  });
  const maxTa=Math.max(...trend.map(r=>r.ta),1);
  const bar=(v,max,c)=>`<div style="background:#f0f0f0;border-radius:2px;height:5px;min-width:50px"><div style="width:${Math.min(100,v/max*100)}%;height:100%;background:${c};border-radius:2px"></div></div>`;
  const trendRows=trend.map(r=>{
    const sel=r.mo===m;
    return`<tr style="border-bottom:1px solid #f0f0f0;${sel?'background:#eff6ff':''};cursor:pointer" onclick="S.kkOvMonth='${r.mo}';go('kk','Tổng quan')">
    <td style="padding:7px 10px;font-size:12.5px;font-weight:600">${mNames[r.mo]||r.mo}</td>
    <td style="padding:7px 10px;font-size:12px;text-align:right;color:#0369a1">${fmtB(r.dt)}</td>

function rKKTonAm(){
  if(!S.tonAmCache){try{S.tonAmCache=JSON.parse(localStorage.getItem('tonam_cache')||'null');}catch(e){}}
  const cache=S.tonAmCache;
  const months=cache?.months||{};
  const avail=Object.keys(months).sort();
  if(!S.tonAmMonth||(S.tonAmMonth!=='ALL'&&!months[S.tonAmMonth]))S.tonAmMonth=avail[avail.length-1]||'';
  const m=S.tonAmMonth;
  // ── ALL aggregation ──
  let md;
  if(m==='ALL'){
    const agg={total:0,qh:0,ch:0,totalValue:0,lyDo:{},lyDoValue:{},nganh:{},nganhValue:{},stores:{}};
    for(const mo of avail){
      const d=months[mo];
      agg.total+=d.total; agg.qh+=d.qh; agg.ch+=d.ch; agg.totalValue+=d.totalValue||0;
      for(const[k,v]of Object.entries(d.lyDo||{})) agg.lyDo[k]=(agg.lyDo[k]||0)+v;
      for(const[k,v]of Object.entries(d.lyDoValue||{})) agg.lyDoValue[k]=(agg.lyDoValue[k]||0)+v;
      for(const[k,v]of Object.entries(d.nganh||{})) agg.nganh[k]=(agg.nganh[k]||0)+v;
      for(const[k,v]of Object.entries(d.nganhValue||{})) agg.nganhValue[k]=(agg.nganhValue[k]||0)+v;
      for(const s of(d.stores||[])){
        if(!agg.stores[s.ma])agg.stores[s.ma]={ten:s.ten,count:0,qh:0,ch:0,value:0};
        agg.stores[s.ma].count+=s.count; agg.stores[s.ma].qh+=s.qh; agg.stores[s.ma].ch+=s.ch; agg.stores[s.ma].value+=(s.value||0);
      }
    }
    agg.stores=Object.entries(agg.stores).sort((a,b)=>b[1].count-a[1].count)
      .map(([ma,v])=>({ma,ten:v.ten,count:v.count,qh:v.qh,ch:v.ch,value:Math.round(v.value)}));
    md=agg;
  } else {
    md=months[m];
  }
  const age=cache?.ts?Math.round((Date.now()-cache.ts)/60000):null;
  const ageStr=age!=null?(age<60?age+'p trước':Math.round(age/60)+'h trước'):'chưa đồng bộ';
  const syncBar=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <span style="font-size:12px;color:var(--t2)">${avail.length?'✅ Dữ liệu Lark · '+ageStr:'⚠️ Chưa có dữ liệu'}</span>
    <button onclick="syncTonAm(this)" style="background:#1a2558;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer">🔄 Đồng bộ Lark</button>
  </div>`;
  if(!avail.length)return`<div class="card">${syncBar}<div style="text-align:center;padding:32px 0"><div style="font-size:48px;margin-bottom:10px">📉</div><p style="color:var(--t2);font-size:13px">Bấm <strong>Đồng bộ Lark</strong> để tải dữ liệu tồn âm từ Lark bitable.</p><p style="color:var(--t3);font-size:11px;margin-top:6px">Chạy <code>node automation/sync-tonam.js</code> để tạo cache nếu chưa có.</p></div></div>`;
  const rev=cache?.revenue||{};
  const fmtDT=v=>v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(0)+'M':'—';
  const allTotalDT=avail.reduce((s,mo)=>s+(rev[mo]||0),0);
  // Tên tháng — tự động cho T01-T12
  const mNames={T01:'Tháng 1',T02:'Tháng 2',T03:'Tháng 3',T04:'Tháng 4',T05:'Tháng 5',T06:'Tháng 6',

function rKKBienBan(){

  const C=S.bbkkCache;
  const age=C?.ts?Math.round((Date.now()-C.ts)/3600000):null;
  const fmt=v=>Math.abs(Math.round(v||0)).toLocaleString('vi-VN');
  const fmtDT=v=>v>=1e9?(v/1e9).toFixed(1)+' tỷ':v>=1e6?(v/1e6).toFixed(0)+' tr':'—';
  const syncBar=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <span style="font-size:12px;color:var(--t2)">${C?`✅ Cập nhật ${age!=null?(age<24?age+'h':Math.round(age/24)+'d'):''} trước · ${(C.t1||[]).length} biên bản`:'⚠️ Chưa có dữ liệu — bấm Đồng bộ'}</span>
    <button class="btn b-ok b-sm" onclick="syncBBKK(this)">🔄 Đồng bộ Lark</button>
  </div>`;
  if(!C)return`<div class="card">${syncBar}<div style="text-align:center;padding:32px 0"><div style="font-size:48px;margin-bottom:10px">📋</div><p style="color:var(--t2);font-size:13px">Bấm <strong>Đồng bộ Lark</strong> để tải dữ liệu biên bản kiểm kê từ Lark.</p><p style="color:var(--t3);font-size:11px;margin-top:6px">Hoặc chạy <code>node automation/sync-bbkk.js</code> rồi push lên GitHub.</p></div></div>`;
  const t1=C.t1||[]; const t2=C.t2||[]; const t4=C.t4||[];
  const years=[...new Set(t1.map(r=>r.nam))].sort((a,b)=>a-b);
  const selY=S.bbkkYear||(years[years.length-1]||2026);
  const t1y=t1.filter(r=>r.nam===selY);
  const months=[...new Set(t1y.map(r=>r.thang))].sort((a,b)=>a-b);
  const selM=S.bbkkMonth||0;
  const rows=selM?t1y.filter(r=>r.thang===selM):t1y;
  const bbTab=S.bbkkTab||'bienban';
  /* KPIs */
  const totDenBu=rows.reduce((s,r)=>s+(r.denBu||0),0);
  const totCT=rows.reduce((s,r)=>s+(r.congtyHT||0),0);
  const totCLp=rows.reduce((s,r)=>s+(r.clPlus||0),0);
  const totCLm=rows.reduce((s,r)=>s+(r.clMinus||0),0);
  const totNet=totCLp+totCLm;
  const t2y=t2.filter(r=>r.nam===selY);

  /* header bar */

      ${[...new Set([...years,selY])].sort((a,b)=>a-b).map(y=>`<option value="${y}" ${selY===y?'selected':''}>${y}</option>`).join('')}
    </select>
  </span>`;
  const tabBtns=[{v:'bienban',lb:'📋 Biên bản'},{v:'quy',lb:'💰 Quỹ hỗ trợ'},{v:'dt',lb:'📊 Doanh thu'}].map(({v,lb})=>
    `<button onclick="S.bbkkTab='${v}';go('kk','Biên bản kiểm kê')" style="padding:6px 14px;font-size:12.5px;border-radius:8px;border:none;background:${bbTab===v?'var(--pri)':'#f0f2f7'};color:${bbTab===v?'#fff':'var(--t2)'};font-weight:${bbTab===v?700:500}">${lb}</button>`).join('');
  const kpis=`<div class="g4" style="margin-bottom:0">

    <div class="kpi" style="color:${totNet<0?'#dc2626':'#16a34a'}"><div class="kpi-lb">Chênh lệch ròng</div><div class="kpi-v">${totNet>=0?'+':'−'}${fmt(totNet)}<span class="kpi-u">đ</span></div><div class="kpi-tr" style="font-size:10px;color:#6b7280">CL+ ${fmt(totCLp)} / CL− ${fmt(Math.abs(totCLm))}</div><div class="kpi-bg">⚖️</div></div>
    <div class="kpi" style="color:#dc2626"><div class="kpi-lb">ST đền bù</div><div class="kpi-v">${totDenBu!==0?fmt(Math.abs(totDenBu)):'0'}<span class="kpi-u">đ</span></div><div class="kpi-tr" style="color:#dc2626;font-size:11px">Tổng đền bù</div><div class="kpi-bg">⚠️</div></div>

  /* TABLE 1 */
  const bbRows=rows.length?[...rows].sort((a,b)=>b.ngay-a.ngay).map(r=>{
    const net=(r.clPlus||0)+(r.clMinus||0);

  const bbTable=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">

    </tr></thead><tbody>${bbRows}</tbody>
  </table></div>`;
  /* TABLE 2 */
  const quyKpis=`<div class="g4" style="margin-bottom:14px">
    <div class="kpi" style="color:#0369a1"><div class="kpi-lb">Tổng DT chuỗi</div><div class="kpi-v" style="font-size:18px">${fmtDT(totDT)}<span class="kpi-u">VNĐ</span></div><div class="kpi-bg">💰</div></div>
    <div class="kpi" style="color:#0369a1"><div class="kpi-lb">Tổng quỹ HT</div><div class="kpi-v" style="font-size:18px">${fmt(totQuy)}<span class="kpi-u">đ</span></div><div class="kpi-tr" style="font-size:10px;color:var(--t2)">${totDT>0?(totQuy/totDT*100).toFixed(2)+'% DT':''}</div><div class="kpi-bg">🏦</div></div>
    <div class="kpi" style="color:#f97316"><div class="kpi-lb">Đã dùng quỹ</div><div class="kpi-v" style="font-size:18px">${fmt(Math.abs(totHTong))}<span class="kpi-u">đ</span></div><div class="kpi-tr" style="font-size:10px;color:#f97316">${totQuy>0?Math.round(Math.abs(totHTong)/totQuy*100)+'% quỹ':''}</div><div class="kpi-bg">📤</div></div>
    <div class="kpi" style="color:#16a34a"><div class="kpi-lb">Quỹ còn lại</div><div class="kpi-v" style="font-size:18px">${fmt(totConLai)}<span class="kpi-u">đ</span></div><div class="kpi-tr tr-ok" style="font-size:10px">${totQuy>0?Math.round(totConLai/totQuy*100)+'% còn':''}</div><div class="kpi-bg">✅</div></div>
  </div>`;
  const quyRows=[...t2y].sort((a,b)=>Math.abs(b.htTong||0)+Math.abs(b.stDen||0)-Math.abs(a.htTong||0)-Math.abs(a.stDen||0)).map(r=>{
    const tn=(r.ten||r.ma||'').replace(/^[^_-]+[_-]/,'');
    const pct=r.quyHT>0?Math.round(Math.abs(r.htTong||0)/r.quyHT*100):0;
    const danger=r.conLai<100000;
    const pctTag=pct>0?`<span style="background:${pct>80?'#fee2e2':pct>50?'#fef3c7':'#dcfce7'};color:${pct>80?'#dc2626':pct>50?'#d97706':'#16a34a'};padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">${pct}%</span>`:'-';
    return`<tr style="border-bottom:1px solid #f0f2f7;${danger?'background:#fff8f8':''}">
      <td style="padding:7px 6px;font-size:12px;font-weight:600;color:${danger?'#dc2626':'var(--t1)'}">${tn}</td>
      <td style="padding:7px 6px;text-align:right;font-size:11px">${fmt(r.tongDT)}</td>
      <td style="padding:7px 6px;text-align:right;font-size:11px;color:#0369a1">${fmt(r.quyHT)}</td>
      <td style="padding:7px 6px;text-align:right;font-size:11px;color:#f97316">${r.htTong>0?fmt(r.htTong):'-'}</td>

      <td style="padding:7px 6px;text-align:center;font-size:11px;color:var(--t2)">${r.htVaoThang?'T'+r.htVaoThang:'-'}</td>
    </tr>`;
  }).join('');
  const quyTable=`${quyKpis}<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
    <thead><tr style="background:#f8f9fc;border-bottom:2px solid var(--border)">
      <th style="padding:8px 6px;text-align:left;font-size:11px;color:var(--t2)">Siêu thị</th>
      <th style="padding:8px 6px;text-align:right;font-size:11px;color:#0369a1">Tổng DT</th>
      <th style="padding:8px 6px;text-align:right;font-size:11px;color:#0369a1">Quỹ HT</th>
      <th style="padding:8px 6px;text-align:right;font-size:11px;color:#f97316">CT hỗ trợ</th>
      <th style="padding:8px 6px;text-align:right;font-size:11px;color:#dc2626">ST đền</th>
      <th style="padding:8px 6px;text-align:right;font-size:11px;color:#16a34a">Còn lại</th>
      <th style="padding:8px 6px;text-align:center;font-size:11px;color:var(--t2)">% Dùng quỹ</th>
      <th style="padding:8px 6px;text-align:center;font-size:11px;color:var(--t2)">Tháng HT</th>
    </tr></thead><tbody>${quyRows}</tbody>
  </table></div>`;
  /* TABLE 4 */
  const maxDT=Math.max(...t4.map(r=>r.dt),1);
  const dtBars=t4.filter(r=>r.dt>0).map(r=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5">
      <div style="min-width:30px;font-size:12px;font-weight:700;color:var(--t2)">T${r.thang}</div>
      <div style="flex:1;background:#f0f2f7;border-radius:4px;overflow:hidden">
        <div style="height:10px;background:linear-gradient(90deg,#0066cc,#00c6ff);border-radius:4px;width:${Math.round(r.dt/maxDT*100)}%"></div>
      </div>
      <div style="min-width:90px;text-align:right;font-size:12px;font-weight:700;color:#1a2558">${fmtDT(r.dt)}</div>
    </div>`).join('');
  const dtSection=`<div style="font-size:13px;font-weight:700;margin-bottom:14px">📊 Doanh thu tháng (tỷ VNĐ)</div>${dtBars}`;
  const content=bbTab==='bienban'?`<div class="card">${bbTable}</div>`:bbTab==='quy'?`<div class="card">${quyTable}</div>`:`<div class="card">${dtSection}</div>`;
  return`
<div class="card" style="margin-bottom:14px">${syncBar}
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center">

</div>
${content}`;
}
function rKKXuatHuy(){
  if(!S.xhCache){try{S.xhCache=JSON.parse(localStorage.getItem('xuathuy_cache')||'null');}catch(e){}}
  const C=S.xhCache;
  const age=C?.ts?Math.round((Date.now()-C.ts)/60000):null;
  const ageStr=age!=null?(age<60?age+'p trước':Math.round(age/60)+'h trước'):'chưa đồng bộ';
  const syncBar=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <span style="font-size:12px;color:var(--t2)">${C?'✅ Dữ liệu Lark · '+ageStr:'⚠️ Chưa có dữ liệu'}</span>
    <button onclick="syncXuatHuy(this)" style="background:#1a2558;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer">🔄 Đồng bộ Lark</button>
  </div>`;
  if(!C||!C.data)return`<div class="card">${syncBar}<div style="text-align:center;padding:32px 0"><div style="font-size:48px;margin-bottom:10px">🗑️</div><p style="color:var(--t2);font-size:13px">Bấm <strong>Đồng bộ Lark</strong> để tải dữ liệu xuất hủy từ Lark bitable.</p></div></div>`;

  // ── Chế độ: ST (siêu thị) / CVS ──
  const mode=S.xhMode==='cvs'?'cvs':'st';
  const hasCVS=!!C.cvs&&Object.keys(C.cvs).length>0;
  const modeBar=`<div style="display:flex;gap:6px;margin-bottom:12px">
    <button onclick="S.xhMode='st';S.xhMonth='ALL';go('kk','Xuất hủy - lỗi hỏng')" style="padding:6px 16px;font-size:12.5px;font-weight:600;border-radius:8px;border:1px solid ${mode==='st'?'#1a2558':'#e2e8f0'};background:${mode==='st'?'#1a2558':'#fff'};color:${mode==='st'?'#fff':'var(--t1)'};cursor:pointer">🏪 Siêu thị</button>
    <button onclick="S.xhMode='cvs';S.xhMonth='ALL';go('kk','Xuất hủy - lỗi hỏng')" style="padding:6px 16px;font-size:12.5px;font-weight:600;border-radius:8px;border:1px solid ${mode==='cvs'?'#e91e7b':'#e2e8f0'};background:${mode==='cvs'?'#e91e7b':'#fff'};color:${mode==='cvs'?'#fff':hasCVS?'var(--t1)':'#ccc'};cursor:${hasCVS?'pointer':'default'}">🏬 CVS${hasCVS?'':' (chưa có dữ liệu)'}</button>
  </div>`;
  const DS=mode==='cvs'?(C.cvs||{}):C.data;
  const REVS=mode==='cvs'?(C.revenueCVS||{}):(C.revenue||{});
  if(!Object.keys(DS).length)return`<div class="card">${syncBar}${modeBar}<div style="text-align:center;padding:24px 0"><p style="color:var(--t2);font-size:13px">Chưa có dữ liệu ${mode==='cvs'?'CVS':'siêu thị'} — bấm Đồng bộ Lark.</p></div></div>`;

  const years=Object.keys(DS).sort();
  if(!S.xhYear||!DS[S.xhYear])S.xhYear=years[years.length-1];
  const Y=S.xhYear;
  const yData=DS[Y]||{};
  const avail=Object.keys(yData).sort();
  if(S.xhMonth!=='ALL'&&!yData[S.xhMonth])S.xhMonth='ALL';
  const m=S.xhMonth;
  const rev=REVS[Y]||{};
  const mNames={T01:'Tháng 1',T02:'Tháng 2',T03:'Tháng 3',T04:'Tháng 4',T05:'Tháng 5',T06:'Tháng 6',T07:'Tháng 7',T08:'Tháng 8',T09:'Tháng 9',T10:'Tháng 10',T11:'Tháng 11',T12:'Tháng 12'};
  const fmtV=v=>v>=1e9?(v/1e9).toFixed(2)+' tỷ':v>=1e6?(v/1e6).toFixed(1)+' tr':v>0?Math.round(v/1e3)+'k':'—';
  const fmtDT=v=>v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(0)+'M':'—';

  // ── Aggregate (ALL = gộp các tháng) ──
  let md;
  if(m==='ALL'){
    const agg={total:0,qty:0,value:0,stores:{},items:{},tinhTrang:{},tinhTrangValue:{}};
    for(const mo of avail){
      const d=yData[mo];
      agg.total+=d.total;agg.qty+=d.qty;agg.value+=d.value;
      for(const s of(d.stores||[])){
        if(!agg.stores[s.ma])agg.stores[s.ma]={ten:s.ten,count:0,qty:0,value:0};
        agg.stores[s.ma].count+=s.count;agg.stores[s.ma].qty+=s.qty;agg.stores[s.ma].value+=s.value;
      }
      for(const it of(d.items||[])){
        if(!agg.items[it.ma])agg.items[it.ma]={ten:it.ten,count:0,qty:0,value:0};
        agg.items[it.ma].count+=it.count;agg.items[it.ma].qty+=it.qty;agg.items[it.ma].value+=it.value;
      }
      for(const[k,v]of Object.entries(d.tinhTrang||{}))agg.tinhTrang[k]=(agg.tinhTrang[k]||0)+v;
      for(const[k,v]of Object.entries(d.tinhTrangValue||{}))agg.tinhTrangValue[k]=(agg.tinhTrangValue[k]||0)+v;
    }
    agg.stores=Object.entries(agg.stores).sort((a,b)=>b[1].value-a[1].value).map(([ma,v])=>({ma,...v}));
    agg.items=Object.entries(agg.items).sort((a,b)=>b[1].value-a[1].value).map(([ma,v])=>({ma,...v}));
    md=agg;
  } else md={...yData[m],stores:[...(yData[m].stores||[])].sort((a,b)=>b.value-a.value),items:[...(yData[m].items||[])].sort((a,b)=>b.value-a.value)};

  const dtMonth=m==='ALL'?avail.reduce((s,mo)=>s+(rev[mo]||0),0):(rev[m]||0);
  const pctDT=dtMonth>0?(md.value/dtMonth*100).toFixed(2):'—';
  const mLabel=m==='ALL'?`${avail[0]}–${avail[avail.length-1]}`:m;
  const avgPerMonth=m==='ALL'&&avail.length>0?md.value/avail.length:0;

  // ── Filter q ──
  const q=(S.xhQ||'').toLowerCase();
  const stores=md.stores.filter(s=>!q||(s.ten||'').toLowerCase().includes(q)||(s.ma||'').toLowerCase().includes(q));
  const items=md.items.filter(it=>!q||(it.ten||'').toLowerCase().includes(q)||(it.ma||'').toLowerCase().includes(q));

  // ── Cảnh báo & nhận định ──
  const alerts=[];
  if(dtMonth>0&&md.value/dtMonth>0.01)alerts.push({lv:'🔴 Tỷ lệ cao',c:'#dc2626',msg:`Giá trị xuất hủy ${fmtV(md.value)} = ${pctDT}% doanh thu ${mLabel} — vượt ngưỡng 1%`,act:'Rà soát nguyên nhân hủy tại các ST top, kiểm soát đặt hàng và FIFO'});
  else if(dtMonth>0&&md.value/dtMonth>0.005)alerts.push({lv:'🟠 Cần theo dõi',c:'#f97316',msg:`Giá trị xuất hủy ${fmtV(md.value)} = ${pctDT}% doanh thu — trên mức mục tiêu 0.5%`,act:'Theo dõi các mã hàng hủy lặp lại, điều chỉnh định mức đặt hàng'});
  const topSt=md.stores[0];
  if(topSt&&md.value>0&&topSt.value/md.value>0.25)alerts.push({lv:'🟠 Tập trung ST',c:'#f97316',msg:`${topSt.ten}: ${fmtV(topSt.value)} = ${(topSt.value/md.value*100).toFixed(0)}% tổng giá trị hủy — tập trung bất thường`,act:'Audit quy trình bảo quản và đặt hàng tại '+topSt.ten});
  const topIt=md.items[0];
  if(topIt&&md.value>0&&topIt.value/md.value>0.15)alerts.push({lv:'🟡 Mã hàng',c:'#eab308',msg:`${topIt.ten||topIt.ma}: ${fmtV(topIt.value)} (${topIt.qty.toLocaleString()} sp) — mã hủy lớn nhất`,act:'Xem lại định mức nhập và tốc độ bán của mã này'});
  // Tháng tăng đột biến (khi ALL)
  if(m==='ALL'&&avail.length>=2){
    const vals=avail.map(mo=>yData[mo].value);
    const maxIdx=vals.indexOf(Math.max(...vals));
    if(vals[maxIdx]>avgPerMonth*1.5)alerts.push({lv:'🔴 Đột biến',c:'#dc2626',msg:`${mNames[avail[maxIdx]]}: ${fmtV(vals[maxIdx])} — cao gấp ${(vals[maxIdx]/avgPerMonth).toFixed(1)}× trung bình tháng (${fmtV(avgPerMonth)})`,act:'Điều tra nguyên nhân đột biến '+mNames[avail[maxIdx]]});

// Debounced search: lưu giá trị ngay, chờ gõ xong mới re-render rồi focus lại
function qDebounce(el,path,id,tab){
  const v=el.value;
  const p=path.split('.');let o=S;while(p.length>1)o=o[p.shift()];o[p[0]]=v;
  clearTimeout(window._qDeb);
  window._qDeb=setTimeout(()=>{
    go('kk',tab);
    const inp=document.getElementById(id);
    if(inp){inp.focus();const n=inp.value.length;inp.setSelectionRange(n,n);}
  },350);
}
async function syncXuatHuy(btn){
  if(btn){btn.disabled=true;btn.textContent='⏳ Đang đồng bộ...';}
  try{
    let d=null;
    try{
      const r=await fetch('http://localhost:3002/api/sync-xuathuy',{signal:AbortSignal.timeout(120000)});
      if(r.ok){d=await r.json();if(d.error)d=null;}
    }catch(_){}
    if(!d){
      if(btn)btn.textContent='⏳ Lấy từ Lark...';
      try{
        const r=await fetch('/api/lark-xuathuy',{signal:AbortSignal.timeout(60000)});
        if(r.ok){const j=await r.json();if(j.data&&!j.error)d=j;}
      }catch(_){}
    }
    if(!d){
      if(btn)btn.textContent='⏳ Tải cache GitHub...';
      const r=await fetch('https://raw.githubusercontent.com/kairjx1/KSCL-Sakuko/main/xuathuy-cache.json?t='+Date.now());
      if(!r.ok)throw new Error('HTTP '+r.status);
      d=await r.json();
    }
    if(!d||typeof d.data!=='object')throw new Error('Format không hợp lệ');
    localStorage.setItem('xuathuy_cache',JSON.stringify(d));
    S.xhCache=d;
    go(S.page,S.tab);
    toast('✅ Đồng bộ xuất hủy thành công','t-ok');
  }catch(e){
    toast('❌ Lỗi đồng bộ: '+e.message,'t-err');
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='🔄 Đồng bộ Lark';}
  }
}

function qcDiemUpdate(i,field,val){
  if(!S.qcDiemRows[i])return;

  const max=parseFloat(S.qcDiemRows[i].max)||0,thuc=parseFloat(S.qcDiemRows[i].thuc)||0;

  if(cLoi)cLoi.textContent=qcDiemPct(loi);

function qcDiemLoad(year,month){
  const y=String(year||S.qcDiemYear||'2026'),m=String(month||S.qcDiemMonth||'5');
  S.qcDiemYear=y;S.qcDiemMonth=m;
  const qcdb=getQCDB();if(!qcdb){alert('Không kết nối được Firebase!');return;}
  // Load token: nếu import xảy ra trong khi đang fetch Firebase, callback cũ bị bỏ qua
  const token=S._qcDiemLoadSeq=(S._qcDiemLoadSeq||0)+1;
  qcdb.ref(`qc_diem/${y}/${m}`).get().then(snap=>{
    if(S._qcDiemLoadSeq!==token)return; // stale — đã import hoặc load mới hơn, bỏ qua
    const d=snap.exists()?snap.val():null;
    S.qcDiemRows=d&&Array.isArray(d.rows)?d.rows:[];
    S.qcDiemLoiHM=d&&Array.isArray(d.loiHM)?d.loiHM:[];
    go('qc','Chấm điểm dịch vụ');
  }).catch(e=>alert('Lỗi tải dữ liệu: '+e.message));
}

function qcDiemSaveCore(y,m,rows,loiHM,btn,toastMsg){

function qcDiemImportFile(input){
  const file=input.files[0];if(!file)return;
  input.value='';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws1=wb.Sheets['Chấm điểm'];
      const rows1=ws1?XLSX.utils.sheet_to_json(ws1,{header:1}):[];
      let month=null,year=null;
      const newRows=[];
      for(let i=1;i<rows1.length;i++){
        const [t,y,st,max,thuc]=rows1[i];
        if(!st)continue;
        if(!month&&t){month=String(parseInt(t));year=String(parseInt(y));}
        newRows.push({st:String(st),max:String(max||''),thuc:String(thuc||'')});
      }
      const ws2=wb.Sheets['Lỗi hạng mục'];
      const rows2=ws2?XLSX.utils.sheet_to_json(ws2,{header:1}):[];
      const newLoi=[];
      for(let i=1;i<rows2.length;i++){
        const [t,y,cat,tyle,soLoi]=rows2[i];
        if(!cat)continue;
        if(!month&&t){month=String(parseInt(t));year=String(parseInt(y));}
        newLoi.push({cat:String(cat),tyle:parseFloat(tyle)||0,soLoi:parseInt(soLoi)||0});
      }
      if(!newRows.length&&!newLoi.length){alert('File không có dữ liệu hoặc sai tên sheet (cần "Chấm điểm" và "Lỗi hạng mục")!');return;}
      if(month){S.qcDiemMonth=month;S.qcDiemYear=year;}
      // Bump load token để Firebase callback cũ (auto-load) không ghi đè data vừa import
      S._qcDiemLoadSeq=(S._qcDiemLoadSeq||0)+1;
      S.qcDiemRows=newRows;S.qcDiemLoiHM=newLoi;S._qcDiemAutoLoaded=true;
      go('qc','Chấm điểm dịch vụ');
      // Tự động lưu lên Firebase ngay sau import — không cần bấm Lưu thủ công
      const _y=S.qcDiemYear,_m=S.qcDiemMonth;
      setTimeout(()=>qcDiemSaveCore(_y,_m,newRows,newLoi,null,`✅ Đã import & tự lưu ${newRows.length} ST · ${newLoi.length} hạng mục (T${_m}/${_y})`),300);
    }catch(err){alert('Lỗi đọc file Excel: '+err.message);}
  };
  reader.readAsBinaryString(file);
}

  const s=parseFloat(document.getElementById(pfx+'-donST')?.value)||0;

let _qcDTHistCache={};
function qcDTShowHistory(){
  const panel=document.getElementById('qcdt-hist-panel');if(!panel)return;

  const y=S.qcDTYear||'2026',m=S.qcDTMonth||'5';

  panel.innerHTML='<div style="padding:12px;text-align:center;color:#94a3b8;font-size:13px">⏳ Đang tải lịch sử T'+m+'/'+y+'...</div>';
  panel.style.display='block';
  db.ref(`qc_doitra_history/${y}/${m}`).get().then(snap=>{

    _qcDTHistCache={};
    const vers=[];
    snap.forEach(child=>{_qcDTHistCache[child.key]=child.val();vers.push({key:child.key,...child.val()});});
    vers.sort((a,b)=>(b._snapshotAt||0)-(a._snapshotAt||0));

    vers.slice(0,15).map(v=>{
      const dt=v._snapshotAt?new Date(v._snapshotAt).toLocaleString('vi-VN'):'?';
      const st=v.st||{},cvs=v.cvs||{};

      return`<div style="padding:9px 12px;border-bottom:1px solid #f0f0ff;font-size:12.5px">

function qcDTRestore(key){
  const data=_qcDTHistCache[key];

  if(!confirm('Khôi phục phiên bản này? Dữ liệu hiện tại trên form sẽ bị thay thế.'+noteWarn))return;
  S.qcDTST=data.st||{};S.qcDTCVS=data.cvs||{};

async function qcGLLoad(year,month){
  S.qcGLYear=String(year);S.qcGLMonth=String(month);
  const db2=getQCDB();if(!db2)return;
  const[snap,ysnap,khsnap]=await Promise.all([
    db2.ref(`qc_gianlantctm/${year}/${month}`).get(),
    db2.ref(`qc_gianlantctm/${year}`).get(),
    db2.ref(`qc_kh/${year}`).get()
  ]);
  S.qcGLData=snap.exists()?snap.val():null;
  S.qcGLYearData=ysnap.exists()?ysnap.val():{};
  S.qcGLKHData=khsnap.exists()?khsnap.val():{};
  S.qcGLKH=S.qcGLKHData[String(month)]||0;
  S._qcGLAutoLoaded=true;
  go('qc','Check gian lận định kỳ và CTKM');
}
async function qcGLSaveKH(btn){

    S.qcGLKHData[S.qcGLMonth]=v;S.qcGLKH=v;
    if(btn){btn.disabled=false;btn.textContent='✅ Đã lưu';}

}

async function _driveUpload(file,filename){
  const fd=new FormData();
  fd.append('file',file,filename||file.name);
  fd.append('name',filename||file.name);
  const res=await fetch('/drive-upload',{method:'POST',body:fd});
  const j=await res.json();
  if(!j.ok)throw new Error(j.error||'Upload thất bại');
  return j.viewUrl;
}
async function qcDocsLoad(){
  const db2=getQCDB();if(!db2)return;
  const snap=await db2.ref('qc_docs').get();
  S.qcDocsData=snap.exists()?snap.val():{};
}
async function qcDocUpload(type,idx,inp){
  const file=inp.files[0];if(!file)return;
  const lbl=inp.parentElement;
  const origTxt=lbl.childNodes[0].textContent;
  lbl.childNodes[0].textContent='⏳';
  try{
    const uid=Date.now()+'_'+Math.random().toString(36).substr(2,6);
    const url=await _driveUpload(file,`${uid}_${file.name}`);
    await getQCDB().ref(`qc_docs/${type}/${idx}`).set({url,filename:file.name,uploaded_at:Date.now()});
    if(!S.qcDocsData[type])S.qcDocsData[type]={};
    S.qcDocsData[type][idx]={url,filename:file.name};
    alert('✅ Upload thành công!');
    go('qc','Biên bản xử lý vi phạm');
  }catch(e){lbl.childNodes[0].textContent=origTxt;alert('Lỗi upload: '+e.message);}
}
async function qcBBLoad(year,month){
  S.qcBBYear=String(year);S.qcBBMonth=String(month);
  const db2=getQCDB();if(!db2)return;
  const[snap,ysnap,dsnap,nsnap]=await Promise.all([
    db2.ref(`qc_bienbans/${year}/${month}`).get(),
    db2.ref(`qc_bienbans/${year}`).get(),
    db2.ref('qc_docs').get(),
    db2.ref('qc_doc_names').get()
  ]);
  S.qcBBList=snap.exists()?Object.entries(snap.val()).map(([id,v])=>({id,...v})):[];
  S.qcBBYearData=ysnap.exists()?ysnap.val():{};
  S.qcDocsData=dsnap.exists()?dsnap.val():{};
  const nn=nsnap.exists()?nsnap.val():{};
  S.qcDocLists={noi_quy:nn.noi_quy||BB_QDOCS.slice(),mau_form:nn.mau_form||BB_TEMPS.slice()};
  S._qcBBAutoLoaded=true;
  go('qc','Biên bản xử lý vi phạm');
}

async function qcBBSave(btn){
  const nguoi=(document.getElementById('bb-nguoi').value||'').trim();
  const st=document.getElementById('bb-st').value;
  const loai=document.getElementById('bb-loai').value;
  const lydo=(document.getElementById('bb-lydo').value||'').trim();
  const ghichu=(document.getElementById('bb-ghichu').value||'').trim();
  const month=document.getElementById('bb-month').value;
  const year=document.getElementById('bb-year').value;
  const file=document.getElementById('bb-file').files[0];
  if(!nguoi||!st||!loai||!lydo){alert('Vui lòng điền đầy đủ (*): Tên người vi phạm, Siêu thị, Loại xử lý, Lý do');return;}
  btn.disabled=true;btn.textContent='⏳ Đang lưu...';
  const prog=document.getElementById('bb-prog'),progTxt=document.getElementById('bb-prog-txt');
  try{
    let file_url='',ten_file='';
    if(file){
      if(file.size>10*1024*1024){throw new Error('File quá 10MB');}
      prog.style.display='block';progTxt.textContent='⏳ Đang upload file...';
      const uid=Date.now()+'_'+Math.random().toString(36).substr(2,6);
      file_url=await _driveUpload(file,`${uid}_${file.name}`);
      ten_file=file.name;
      progTxt.textContent='✅ Upload xong!';
    }
    const db2=getQCDB();
    const id=db2.ref(`qc_bienbans/${year}/${month}`).push().key;
    await db2.ref(`qc_bienbans/${year}/${month}/${id}`).set({
      nguoi_vi_pham:nguoi,sieu_thi:st,loai,ly_do:lydo,ghi_chu:ghichu,
      ten_file,file_url,nguoi_upload:S.user&&S.user.email||'—',created_at:Date.now()
    });
    prog.style.display='none';
    btn.disabled=false;btn.textContent='💾 Lưu biên bản';
    alert('✅ Đã lưu biên bản!');
    await qcBBLoad(year,month);
  }catch(e){btn.disabled=false;btn.textContent='💾 Lưu biên bản';prog.style.display='none';alert('Lỗi: '+e.message);}
}
async function qcBBDelete(id,year,month,btn){

async function qcGLSync(btn){
  if(btn){btn.disabled=true;btn.textContent='⏳ Đang đồng bộ...';}
  try{
    let agg=null,counts=null,syncedAt=Date.now();
    // Try local sync-server first (lark-cli, no secret needed)
    try{
      const r=await fetch('http://localhost:3002/api/sync-gl',{signal:AbortSignal.timeout(90000)});
      if(r.ok){const c=await r.json();if(c.agg){agg=c.agg;counts=c.counts;syncedAt=c.syncedAt||syncedAt;}}
    }catch(_){}
    // Fallback: Cloudflare Pages Function (dùng env var, không cần secret)
    if(!agg){
      const r=await fetch('/lark-sync',{signal:AbortSignal.timeout(60000)});
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||'Lỗi không xác định');
      agg=j.data;counts=j.counts;
    }
    const db2=getQCDB();
    await Promise.all(Object.values(agg).map(v=>db2.ref(`qc_gianlantctm/${v.y}/${v.m}`).set({...v,syncedAt})));
    toast(`✅ Đồng bộ: ${Object.keys(agg).length} tháng · ĐK ${counts?.dk||0} · CTKM ${counts?.ctkm||0}`,'t-ok');
    await qcGLLoad(S.qcGLYear,S.qcGLMonth);
  }catch(e){
    toast('❌ Đồng bộ thất bại: '+(e.message||''),'t-err');
    if(btn){btn.disabled=false;btn.textContent='🔄 Đồng bộ Lark';}
  }
}

  const dt=d.doitra||{},stDT=dt.st||{},cvsDT=dt.cvs||{};
  const tongDT=(parseFloat(stDT.tongDon)||0)+(parseFloat(cvsDT.tongDon)||0);
  const bbs=Array.isArray(d.bienbans)?d.bienbans:[];
  const gl=d.gianlam||{};
  const dkTotal=(gl.dk&&gl.dk.total)||0,dkCGT=(gl.dk&&gl.dk.cgt)||0;
  const ctkmTotal=(gl.ctkm&&gl.ctkm.total)||0,ctkmCGT=(gl.ctkm&&gl.ctkm.cgt)||0;
  const loiHM=d.diem&&Array.isArray(d.diem.loiHM)?d.diem.loiHM:[];
  // Comparison deltas
  let dD=null,dS85=null,dTongDT=null,dBB=null;
  if(d2){
    const rows2=d2.diem&&Array.isArray(d2.diem.rows)?d2.diem.rows:[];
    const tot2Max=rows2.reduce((s,r)=>s+(parseFloat(r.max)||0),0);
    const tot2Thuc=rows2.reduce((s,r)=>s+(parseFloat(r.thuc)||0),0);
    const diem2=tot2Max>0?tot2Thuc/tot2Max*100:0;
    dD=+(diemTB-diem2).toFixed(1);
    dS85=stDuoi85.length-rows2.filter(r=>{const mx=parseFloat(r.max),tx=parseFloat(r.thuc);return mx>0&&tx/mx<0.85;}).length;
    const dt2=d2.doitra||{},st2=dt2.st||{},cvs2=dt2.cvs||{};
    dTongDT=tongDT-((parseFloat(st2.tongDon)||0)+(parseFloat(cvs2.tongDon)||0));
    dBB=bbs.length-(Array.isArray(d2.bienbans)?d2.bienbans:[]).length;
  }
  const dTag=(v,inv)=>{if(v===null)return'';const good=inv?v<0:v>0;return v===0?'':`<span style="color:${good?'#16a34a':'#dc2626'};font-size:11px">${v>0?'▲':'▼'}${Math.abs(v)} vs T${e2M}/${e2Y}</span>`;};
  const dTagF=(v)=>{if(v===null)return'';const good=v>0;return`<span style="color:${good?'#16a34a':'#dc2626'};font-size:11px">${v>0?'▲':'▼'}${Math.abs(v).toFixed(1)}% vs T${e2M}/${e2Y}</span>`;};
  // KPI cards
  const kpiCards=`<div class="g4" style="margin-bottom:12px">
    <div class="card" style="padding:14px;text-align:center"><div style="font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;margin-bottom:4px">Điểm TB dịch vụ</div><div style="font-size:28px;font-weight:800;color:${clr(diemTB)}">${fmt(diemTB)}</div><div style="font-size:11px;color:var(--t2)">${dD!==null?dTagF(dD):`${rows.length} ST được chấm`}</div></div>
    <div class="card" style="padding:14px;text-align:center"><div style="font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;margin-bottom:4px">ST dưới 85%</div><div style="font-size:28px;font-weight:800;color:${stDuoi85.length?'#dc2626':'#16a34a'}">${stDuoi85.length}</div><div style="font-size:11px;color:var(--t2)">${dS85!==null?dTag(dS85,true):`${stDuoi90.length} ST trong 85–90%`}</div></div>
    <div class="card" style="padding:14px;text-align:center"><div style="font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;margin-bottom:4px">Tổng đổi trả</div><div style="font-size:28px;font-weight:800;color:#7c3aed">${tongDT||'—'}</div><div style="font-size:11px;color:var(--t2)">${dTongDT!==null?dTag(dTongDT,true):`ST: ${stDT.tongDon||0} · CVS: ${cvsDT.tongDon||0}`}</div></div>
    <div class="card" style="padding:14px;text-align:center"><div style="font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;margin-bottom:4px">Biên bản vi phạm</div><div style="font-size:28px;font-weight:800;color:${bbs.length?'#ea580c':'#16a34a'}">${bbs.length}</div><div style="font-size:11px;color:var(--t2)">${dBB!==null?dTag(dBB,true):`GL CGT: ${dkCGT+ctkmCGT}`}</div></div>
  </div>`;
  // Auto warnings
  const warns=[];
  if(stDuoi85.length>0)warns.push(`⚠️ <b>${stDuoi85.length} siêu thị dưới 85%</b> cần can thiệp ngay: ${stDuoi85.map(r=>(r.st||'').replace(/^Siêu thị\s+/i,'')).join(', ')}`);
  if(stDuoi90.length>0)warns.push(`🔶 ${stDuoi90.length} ST vùng cảnh báo 85–90%: ${stDuoi90.map(r=>(r.st||'').replace(/^Siêu thị\s+/i,'')).join(', ')}`);
  if(dkCGT>0||ctkmCGT>0)warns.push(`🚨 Phát hiện <b>${dkCGT+ctkmCGT} trường hợp gian lận</b> — ĐK: ${dkCGT} CGT · CTKM: ${ctkmCGT} CGT`);
  if(d2&&dD!==null){if(dD>=3)warns.push(`✅ Điểm dịch vụ TB <b>cải thiện +${fmt(dD)}</b> so với T${e2M}/${e2Y}`);else if(dD<=-2)warns.push(`📉 Điểm dịch vụ TB <b>giảm ${fmt(Math.abs(dD))}</b> so với T${e2M}/${e2Y}, cần kiểm tra nguyên nhân`);}
  if(loiHM.length>0){const topL=[...loiHM].sort((a,b)=>(parseFloat(b.soLoi)||0)-(parseFloat(a.soLoi)||0))[0];if(topL&&topL.cat)warns.push(`📋 Lỗi phát sinh nhiều nhất: <b>${topL.cat}</b> — ${topL.soLoi||0} lỗi (${topL.tyle||0}%)`);}
  if(tongDT>50)warns.push(`📦 Tổng đổi trả <b>${tongDT} đơn</b> — cần rà soát nguyên nhân theo ST`);
  const warnSection=warns.length?`<div class="card" style="padding:14px 16px;margin-bottom:12px;border-left:3px solid #f59e0b;background:#fffbeb">
    <div style="font-size:13px;font-weight:700;color:#92400e;margin-bottom:8px">💡 Nhận xét & Cảnh báo tự động</div>
    ${warns.map(w=>`<div style="font-size:12.5px;color:#78350f;margin-bottom:5px;line-height:1.5">${w}</div>`).join('')}
  </div>`:'';
  // ST cần theo dõi
  const hotST=[...stDuoi85.map(r=>({n:r.st,p:parseFloat(r.thuc)/parseFloat(r.max)*100})),...stDuoi90.map(r=>({n:r.st,p:parseFloat(r.thuc)/parseFloat(r.max)*100}))].sort((a,b)=>a.p-b.p);
  // Lỗi phát sinh
  const loiSection=loiHM.length?`<div class="card" style="padding:14px 16px;margin-bottom:12px">
    <div style="font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:10px">📋 Lỗi phát sinh theo danh mục</div>
    ${[...loiHM].sort((a,b)=>(parseFloat(b.soLoi)||0)-(parseFloat(a.soLoi)||0)).map(l=>{const p=parseFloat(l.tyle)||0;return`<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>${l.cat||'—'}</span><b style="color:${p>=30?'#dc2626':p>=15?'#d97706':'#16a34a'}">${l.soLoi||0} lỗi (${p}%)</b></div><div style="height:6px;background:#e5e7eb;border-radius:3px"><div style="height:6px;width:${Math.min(p,100)}%;background:${p>=30?'#dc2626':p>=15?'#d97706':'#16a34a'};border-radius:3px"></div></div></div>`;}).join('')}
  </div>`:'';
  // Đổi trả breakdown
  const topST=[...(stDT.top||[])].filter(x=>x&&x.name).sort((a,b)=>(b.don||0)-(a.don||0)).slice(0,5);
  const topCVS=[...(cvsDT.top||[])].filter(x=>x&&x.name).sort((a,b)=>(b.don||0)-(a.don||0)).slice(0,5);
  const dtSection=`<div class="card" style="padding:14px 16px;margin-bottom:12px">
    <div style="font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:10px">🔄 Đổi trả hàng hóa — T${eM}/${eY}</div>
    <div class="g2" style="gap:14px">
      <div><div style="font-size:12px;font-weight:700;color:#6366f1;margin-bottom:6px">🏪 Siêu thị — ${stDT.tongDon||0} đơn</div>
        ${stDT.donKhach!=null||stDT.donST!=null?`<div style="font-size:11.5px;color:var(--t2);margin-bottom:6px">Do khách: ${stDT.donKhach||0} · Do ST: ${stDT.donST||0}${stDT.donHT!=null?` · Lỗi HT: ${stDT.donHT||0}`:''}</div>`:''}
        ${topST.length?topST.map((s,i)=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--br)"><span>${i+1}. ${s.name}</span><b>${s.don||0}</b></div>`).join(''):`<div style="font-size:12px;color:var(--t2)">Chưa có top</div>`}
        ${stDT.ghiChu?`<div style="font-size:11px;color:#4f46e5;margin-top:6px;padding:6px 8px;background:#eef2ff;border-radius:4px">${stDT.ghiChu}</div>`:''}
      </div>
      <div><div style="font-size:12px;font-weight:700;color:#0891b2;margin-bottom:6px">🛒 CVS — ${cvsDT.tongDon||0} đơn</div>
        ${cvsDT.donKhach!=null||cvsDT.donST!=null?`<div style="font-size:11.5px;color:var(--t2);margin-bottom:6px">Do khách: ${cvsDT.donKhach||0} · Do ST: ${cvsDT.donST||0}${cvsDT.donHT!=null?` · Lỗi HT: ${cvsDT.donHT||0}`:''}</div>`:''}
        ${topCVS.length?topCVS.map((s,i)=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--br)"><span>${i+1}. ${s.name}</span><b>${s.don||0}</b></div>`).join(''):`<div style="font-size:12px;color:var(--t2)">Chưa có top</div>`}
        ${cvsDT.ghiChu?`<div style="font-size:11px;color:#0891b2;margin-top:6px;padding:6px 8px;background:#ecfeff;border-radius:4px">${cvsDT.ghiChu}</div>`:''}
      </div>
    </div>
  </div>`;
  // GL breakdown DK + CTKM
  const dkVPs=Object.entries((gl.dk&&gl.dk.loiVPs)||{}).sort((a,b)=>b[1]-a[1]);
  const ctkmVPs=Object.entries((gl.ctkm&&gl.ctkm.loiVPs)||{}).sort((a,b)=>b[1]-a[1]);
  const glSection=`<div class="card" style="padding:14px 16px;margin-bottom:12px">
    <div style="font-size:13px;font-weight:700;color:#0369a1;margin-bottom:10px">🔍 Check gian lận — T${eM}/${eY}</div>
    <div class="g2" style="gap:14px">
      <div><div style="font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:8px">📅 Định kỳ (ĐK)</div>
        <div style="display:flex;gap:10px;margin-bottom:8px">
          <div style="flex:1;padding:8px;text-align:center;background:#eff6ff;border-radius:8px"><div style="font-size:22px;font-weight:800;color:#1d4ed8">${dkTotal}</div><div style="font-size:10px;color:var(--t2)">Tổng check</div></div>
          <div style="flex:1;padding:8px;text-align:center;background:#fef2f2;border-radius:8px"><div style="font-size:22px;font-weight:800;color:#dc2626">${dkCGT}</div><div style="font-size:10px;color:var(--t2)">CGT (gian lận)</div></div>
        </div>
        ${dkVPs.length?`<div style="font-size:11px;color:var(--t2);font-weight:600;margin-bottom:4px">Top lỗi vi phạm:</div>${dkVPs.slice(0,3).map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;border-bottom:1px solid var(--br)"><span>• ${k}</span><b>${v}</b></div>`).join('')}`:''}
      </div>
      <div><div style="font-size:12px;font-weight:700;color:#7c3aed;margin-bottom:8px">🎁 CTKM</div>
        <div style="display:flex;gap:10px;margin-bottom:8px">
          <div style="flex:1;padding:8px;text-align:center;background:#fdf4ff;border-radius:8px"><div style="font-size:22px;font-weight:800;color:#7c3aed">${ctkmTotal}</div><div style="font-size:10px;color:var(--t2)">Tổng check</div></div>
          <div style="flex:1;padding:8px;text-align:center;background:#fef2f2;border-radius:8px"><div style="font-size:22px;font-weight:800;color:#dc2626">${ctkmCGT}</div><div style="font-size:10px;color:var(--t2)">CGT (gian lận)</div></div>
        </div>
        ${ctkmVPs.length?`<div style="font-size:11px;color:var(--t2);font-weight:600;margin-bottom:4px">Top lỗi vi phạm:</div>${ctkmVPs.slice(0,3).map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;border-bottom:1px solid var(--br)"><span>• ${k}</span><b>${v}</b></div>`).join('')}`:''}
      </div>
    </div>
  </div>`;
  return`${selectorBar}${kpiCards}${warnSection}
${hotST.length?`<div class="card" style="padding:14px 16px;margin-bottom:12px"><div style="font-size:13px;font-weight:700;color:#dc2626;margin-bottom:10px">🚨 ST cần theo dõi (dưới 90%)</div>${hotST.slice(0,8).map(s=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--br)"><span style="font-size:13px">${s.n}</span><span style="font-size:13px;font-weight:700;color:${clr(s.p)}">${fmt(s.p)}</span></div>`).join('')}</div>`:''}
${rows.length?`<div class="chart-box" style="margin-bottom:12px"><div class="chart-title">📊 Điểm dịch vụ theo siêu thị — T${eM}/${eY}${d2?` vs T${e2M}/${e2Y}`:''}</div><div class="chart-wrap" style="height:260px"><canvas id="c-ov-diem"></canvas></div></div>`:''}
${loiSection}${dtSection}${glSection}
<div class="chart-box"><div class="chart-title">📈 Check gian lận định kỳ theo tháng — ${eY}</div><div class="chart-wrap" style="height:200px"><canvas id="c-ov-gl"></canvas></div></div>`;}
