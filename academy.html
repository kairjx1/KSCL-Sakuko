#chat-fab{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:#4f46e5;color:#fff;border:none;cursor:pointer;font-size:22px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(79,70,229,.45);z-index:9000;transition:transform .15s}
#chat-fab:hover{transform:scale(1.1)}
#chat-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:50%;min-width:18px;height:18px;padding:0 3px;display:none;align-items:center;justify-content:center;line-height:1}
#chat-panel{position:fixed;bottom:90px;right:24px;width:370px;height:540px;border-radius:16px;background:#fff;border:1px solid #c7d2fe;box-shadow:0 8px 32px rgba(79,70,229,.2);z-index:8999;display:none;flex-direction:column;overflow:hidden}
#chat-hdr{background:#4f46e5;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#chat-hdr-info{line-height:1.4}
#chat-hdr-title{font-size:14px;font-weight:700}
#chat-hdr-sub{font-size:11px;opacity:.75}
#chat-close-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:20px;padding:0;line-height:1;opacity:.8}
#chat-close-btn:hover{opacity:1}
#chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
#chat-msgs::-webkit-scrollbar{width:4px}
#chat-msgs::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:2px}
.cht-row-me{display:flex;justify-content:flex-end}
.cht-row-other{display:flex;gap:7px;align-items:flex-end}
.cht-av{width:26px;height:26px;border-radius:50%;background:#e0e7ff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#3730a3;flex-shrink:0}
.cht-bub-me{background:#4f46e5;color:#fff;padding:7px 12px;border-radius:14px 14px 3px 14px;font-size:12.5px;max-width:210px;line-height:1.55;word-break:break-word}
.cht-bub-other{background:#f0f4ff;color:#1e1b4b;padding:7px 12px;border-radius:14px 14px 14px 3px;font-size:12.5px;max-width:210px;line-height:1.55;word-break:break-word}
.cht-meta-me{font-size:10px;color:#94a3b8;text-align:right;margin-top:2px}
.cht-name{font-size:10px;font-weight:700;color:#6366f1;margin-bottom:2px}
.cht-meta-other{font-size:10px;color:#94a3b8;margin-top:2px}
.cht-date-sep{text-align:center;font-size:10.5px;color:#94a3b8;margin:6px 0;flex-shrink:0}
#chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#94a3b8;font-size:12.5px;text-align:center;padding:16px}
#chat-bottom{padding:10px;border-top:1px solid #e0e7ff;display:flex;gap:8px;flex-shrink:0;align-items:center}
#chat-inp{flex:1;border:1.5px solid #c7d2fe;border-radius:20px;padding:8px 14px;font-size:13px;outline:none;font-family:inherit;line-height:1.4}
#chat-inp:focus{border-color:#4f46e5}
#chat-send-btn{width:36px;height:36px;border-radius:50%;background:#4f46e5;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
#chat-send-btn:hover{background:#3730a3}
#chat-attach-btn{width:32px;height:32px;border-radius:50%;background:none;border:1.5px solid #c7d2fe;color:#6366f1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;padding:0;transition:.15s}
#chat-attach-btn:hover{background:#e0e7ff;border-color:#6366f1}
#chat-upload-bar{display:none;font-size:11px;color:#4f46e5;padding:3px 12px 4px;text-align:center;background:#eef2ff;border-top:1px solid #e0e7ff;flex-shrink:0}
.cht-img{max-width:195px;max-height:220px;border-radius:10px;cursor:zoom-in;display:block;object-fit:cover;margin:2px 0}
.cht-bub-img-me{display:inline-block;padding:2px;border-radius:12px 12px 3px 12px;overflow:hidden;max-width:210px}
.cht-bub-img-other{display:inline-block;padding:2px;border-radius:12px 12px 12px 3px;overflow:hidden;max-width:210px}
.cht-file-me{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#4f46e5;color:#fff;border-radius:14px 14px 3px 14px;font-size:12px;text-decoration:none;max-width:210px;word-break:break-all}
.cht-file-other{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#f1f5f9;color:#1e1b4b;border-radius:14px 14px 14px 3px;font-size:12px;text-decoration:none;max-width:210px;word-break:break-all;border:1px solid #e0e7ff}
.cht-file-icon{font-size:20px;flex-shrink:0}
.cht-file-name{font-size:11.5px;line-height:1.4}
#chat-name-dlg{position:absolute;inset:0;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;z-index:10}
#chat-name-dlg p{font-size:14px;font-weight:600;color:#1e1b4b;margin:0}
#chat-name-dlg small{font-size:12px;color:#6b7280;margin-top:-8px}
#chat-name-input{width:100%;border:1.5px solid #c7d2fe;border-radius:8px;padding:10px 14px;font-size:14px;outline:none;text-align:center;font-family:inherit;box-sizing:border-box}
#chat-name-input:focus{border-color:#4f46e5}
#chat-name-ok{width:100%;padding:11px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
#chat-name-ok:hover{background:#3730a3}
</style>

<!-- FAB button -->
<button id="chat-fab" onclick="chatToggle()" title="Team Chat">
  <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  <span id="chat-badge"></span>
</button>

<!-- Chat panel -->
<div id="chat-panel">
  <!-- Xác nhận gửi ảnh -->
  <div id="chat-img-confirm" style="display:none;position:absolute;inset:0;background:rgba(15,15,35,.82);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:16px">
    <img id="chat-prev-img" style="max-width:88%;max-height:52%;border-radius:12px;object-fit:contain;box-shadow:0 4px 24px rgba(0,0,0,.5)">
    <p style="color:#e0e7ff;font-size:13px;margin:0;font-weight:500">Gửi ảnh này?</p>
    <div style="display:flex;gap:10px">
      <button id="chat-prev-ok" style="padding:8px 22px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">Gửi</button>
      <button id="chat-prev-cancel" style="padding:8px 22px;background:#fff;color:#374151;border:none;border-radius:8px;cursor:pointer;font-size:13px">Hủy</button>
    </div>
  </div>
  <div id="chat-hdr">
    <div id="chat-hdr-info">
      <div id="chat-hdr-title">💬 KSCL Team Chat</div>
      <div id="chat-hdr-sub">Chat nội bộ nhóm KSCL</div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <button onclick="chatOpenAdmin()" style="background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:15px;padding:0 2px;line-height:1" title="Quản trị">⚙</button>
      <button id="chat-close-btn" onclick="chatToggle()">✕</button>
    </div>
  </div>
  <!-- Admin overlay -->
  <div id="chat-admin" style="display:none;position:absolute;inset:0;background:#fff;z-index:11;flex-direction:column;overflow:hidden">
    <div style="padding:12px 16px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <span style="font-size:13.5px;font-weight:700">⚙ Quản lý tên người dùng</span>
      <button onclick="document.getElementById('chat-admin').style.display='none'" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px;padding:0;line-height:1">✕</button>
    </div>
    <div style="padding:10px 12px;border-bottom:1px solid #e0e7ff;flex-shrink:0">
      <button onclick="chatAdminClear()" style="width:100%;padding:9px;background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">🗑 Xóa toàn bộ lịch sử chat</button>
    </div>
    <div id="chat-admin-list" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px"></div>
  </div>
  <div id="chat-msgs">
    <div id="chat-empty">
      <span style="font-size:36px">💬</span>
      <span>Chưa có tin nhắn nào.<br>Hãy bắt đầu cuộc trò chuyện!</span>
    </div>
  </div>
  <div id="chat-upload-bar">⏳ Đang gửi...</div>
  <div id="chat-bottom">
    <button id="chat-attach-btn" onclick="document.getElementById('chat-file-inp').click()" title="Gửi ảnh / file">📎</button>
    <input id="chat-file-inp" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip" style="display:none" onchange="chatFileSelected(this)">
    <input id="chat-inp" type="text" placeholder="Nhập tin nhắn..." maxlength="500" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}">
    <button id="chat-send-btn" onclick="chatSend()" title="Gửi">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <!-- Name setup dialog (shown first time) -->
  <div id="chat-name-dlg">
    <span style="font-size:40px">👋</span>
    <p>Nhập tên của bạn để chat</p>
    <small>Tên sẽ hiển thị với mọi người trong nhóm</small>
    <input id="chat-name-input" type="text" placeholder="Tên hiển thị..." maxlength="30"
      onkeydown="if(event.key==='Enter')chatSaveName()">
    <button id="chat-name-ok" onclick="chatSaveName()">Bắt đầu chat →</button>
  </div>
</div>

<script>
(function(){
  const FB = {
    apiKey:"AIzaSyBetoDgdhDgfVQsvNZVlpoNs_2CWvYZs6A",
    authDomain:"kscl-chat.firebaseapp.com",
    databaseURL:"https://kscl-chat-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"kscl-chat",
    storageBucket:"kscl-chat.firebasestorage.app",
    messagingSenderId:"6881095822",
    appId:"1:6881095822:web:613bd09724ed74564419df"
  };

  let db=null, msgsRef=null, fbInited=false;
  let panelOpen=false, unread=0;
  let nameOverrides={};

  const myUid=(()=>{
    let id=localStorage.getItem('kscl_uid');
    if(!id){id='u'+Math.random().toString(36).slice(2,9);localStorage.setItem('kscl_uid',id);}
    return id;
  })();
  let myName='';

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function fmtTime(ts){
    const d=new Date(ts);
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }
  function fmtDate(ts){
    const d=new Date(ts),t=new Date();
    if(d.toDateString()===t.toDateString())return 'Hôm nay';
    const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
    if(y===t.getFullYear())return `${day} tháng ${m}`;
    return `${day}/${m}/${y}`;
  }

  let lastDateLabel='';
  function renderMsg(msg){
    const box=document.getElementById('chat-msgs');
    const empty=document.getElementById('chat-empty');
    if(empty)empty.remove();

    const dateLabel=fmtDate(msg.ts||Date.now());
    if(dateLabel!==lastDateLabel){
      lastDateLabel=dateLabel;
      const sep=document.createElement('div');
      sep.className='cht-date-sep';
      sep.textContent='— '+dateLabel+' —';
      box.appendChild(sep);
    }

    const isMine=msg.uid===myUid;
    const displayName=nameOverrides[msg.uid]||msg.name||'Ẩn danh';

    // Build bubble content
    function fileIcon(name){
      const ext=(name||'').split('.').pop().toLowerCase();
      if(['pdf'].includes(ext))return'📕';
      if(['doc','docx'].includes(ext))return'📝';
      if(['xls','xlsx'].includes(ext))return'📊';
      if(['ppt','pptx'].includes(ext))return'📑';
      if(['zip','rar'].includes(ext))return'🗜️';
      return'📄';
    }
    function fmtSize(b){if(!b)return'';if(b<1024)return b+'B';if(b<1048576)return Math.round(b/1024)+'KB';return(b/1048576).toFixed(1)+'MB';}
    let bubbleHtml;
    if(msg.imgUrl){
      bubbleHtml=isMine
        ?`<div class="cht-bub-img-me"><img src="${esc(msg.imgUrl)}" class="cht-img" onclick="chatViewImg(this)" alt="ảnh" loading="lazy"></div>`
        :`<div class="cht-bub-img-other"><img src="${esc(msg.imgUrl)}" class="cht-img" onclick="chatViewImg(this)" alt="ảnh" loading="lazy"></div>`;
    }else if(msg.fileUrl){
      const sz=fmtSize(msg.fileSize);
      bubbleHtml=isMine
        ?`<a href="${esc(msg.fileUrl)}" target="_blank" class="cht-file-me"><span class="cht-file-icon">${fileIcon(msg.fileName)}</span><span class="cht-file-name">${esc(msg.fileName||'file')}${sz?`<br><small style="opacity:.7">${sz}</small>`:''}</span></a>`
        :`<a href="${esc(msg.fileUrl)}" target="_blank" class="cht-file-other"><span class="cht-file-icon">${fileIcon(msg.fileName)}</span><span class="cht-file-name">${esc(msg.fileName||'file')}${sz?`<br><small style="color:#64748b">${sz}</small>`:''}</span></a>`;
    }else{
      bubbleHtml=isMine
        ?`<div class="cht-bub-me">${esc(msg.text||'')}</div>`
        :`<div class="cht-bub-other">${esc(msg.text||'')}</div>`;
    }

    const row=document.createElement('div');
    if(isMine){
      row.className='cht-row-me';
      row.innerHTML=`<div>${bubbleHtml}<div class="cht-meta-me">${fmtTime(msg.ts||Date.now())}</div></div>`;
    } else {
      const init=displayName.charAt(0).toUpperCase();
      row.className='cht-row-other';
      row.innerHTML=`<div class="cht-av">${esc(init)}</div><div>
        <div class="cht-name">${esc(displayName)}</div>
        ${bubbleHtml}
        <div class="cht-meta-other">${fmtTime(msg.ts||Date.now())}</div>
      </div>`;
    }
    box.appendChild(row);
    box.scrollTop=box.scrollHeight;
  }

  function initFb(){
    if(fbInited)return;
    fbInited=true;
    try{
      if(!firebase.apps.length)firebase.initializeApp(FB);
      db=firebase.database();
      msgsRef=db.ref('messages');
      db.ref('nameOverrides').on('value',snap=>{nameOverrides=snap.val()||{};});
      let firstLoad=true;
      msgsRef.limitToLast(60).on('child_added',snap=>{
        const msg=snap.val();
        if(!msg)return;
        if(!firstLoad&&!panelOpen&&msg.uid!==myUid){
          unread++;
          updateBadge();
        }
        renderMsg(msg);
      });
      // after initial batch, allow unread counting
      setTimeout(()=>{firstLoad=false;},1500);
    } catch(e){console.warn('Chat init error:',e);}
  }

  function updateBadge(){
    const b=document.getElementById('chat-badge');
    if(!b)return;
    b.style.display=unread>0?'flex':'none';
    b.textContent=unread>9?'9+':String(unread);
  }

  window.chatToggle=function(){
    if(!S.user){toast('Vui lòng đăng nhập để sử dụng chat','t-warn');return;}
    myName=S.profile?.name||S.user.email||'Ẩn danh';
    panelOpen=!panelOpen;
    const panel=document.getElementById('chat-panel');
    panel.style.display=panelOpen?'flex':'none';
    if(panelOpen){
      unread=0;updateBadge();
      const box=document.getElementById('chat-msgs');
      setTimeout(()=>{box.scrollTop=box.scrollHeight;},50);
      const dlg=document.getElementById('chat-name-dlg');
      if(dlg)dlg.style.display='none';
      document.getElementById('chat-inp')?.focus();
      initFb();
    }
  };

  window.chatSaveName=function(){
    const inp=document.getElementById('chat-name-input');
    const n=(inp?.value||'').trim();
    if(!n)return;
    myName=n;
    localStorage.setItem('kscl_name',n);
    const dlg=document.getElementById('chat-name-dlg');
    if(dlg)dlg.style.display='none';
    document.getElementById('chat-inp')?.focus();
    initFb();
  };

  window.chatSend=function(){
    const inp=document.getElementById('chat-inp');
    const text=(inp?.value||'').trim();
    if(!text||!msgsRef)return;
    msgsRef.push({uid:myUid,name:myName||'Ẩn danh',text,ts:Date.now()});
    inp.value='';
  };

  async function chatSendImage(file){
    if(!file||!msgsRef)return;
    if(!file.type.startsWith('image/')){alert('Chỉ hỗ trợ gửi ảnh');return;}
    if(file.size>8*1024*1024){alert('Ảnh quá lớn (tối đa 8MB)');return;}
    const bar=document.getElementById('chat-upload-bar');
    if(bar){bar.style.display='block';bar.textContent='⏳ Đang xử lý ảnh...';}
    try{
      const imgUrl=await new Promise((res,rej)=>{
        const img=new Image(),url=URL.createObjectURL(file);
        img.onload=()=>{
          URL.revokeObjectURL(url);
          const MAX=900,q=0.72;
          let w=img.width,h=img.height;
          if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
          const c=document.createElement('canvas');
          c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          res(c.toDataURL('image/jpeg',q));
        };
        img.onerror=rej;img.src=url;
      });
      await msgsRef.push({uid:myUid,name:myName||'Ẩn danh',ts:Date.now(),fileName:file.name||'ảnh.jpg',imgUrl});
    }catch(e){console.error(e);alert('Lỗi: '+(e.message||e));}
    finally{if(bar)bar.style.display='none';}
  }

  let _pendingFile=null,_pendingObjUrl=null;

  function chatShowPreview(file){
    if(!file)return;
    _pendingFile=file;
    if(_pendingObjUrl)URL.revokeObjectURL(_pendingObjUrl);
    _pendingObjUrl=URL.createObjectURL(file);
    const dlg=document.getElementById('chat-img-confirm');
    const img=document.getElementById('chat-prev-img');
    if(!dlg||!img)return;
    img.src=_pendingObjUrl;
    dlg.style.display='flex';
  }

  window.chatFileSelected=function(inp){
    const file=inp.files[0];inp.value='';
    if(file)chatShowPreview(file);
  };

  document.getElementById('chat-prev-ok')?.addEventListener('click',async function(){
    document.getElementById('chat-img-confirm').style.display='none';
    if(_pendingFile)await chatSendImage(_pendingFile);
    if(_pendingObjUrl){URL.revokeObjectURL(_pendingObjUrl);_pendingObjUrl=null;}
    _pendingFile=null;
  });

  document.getElementById('chat-prev-cancel')?.addEventListener('click',function(){
    document.getElementById('chat-img-confirm').style.display='none';
    if(_pendingObjUrl){URL.revokeObjectURL(_pendingObjUrl);_pendingObjUrl=null;}
    _pendingFile=null;
  });

  // Paste ảnh từ clipboard (Ctrl+V)
  function _pasteImg(e){
    const item=Array.from(e.clipboardData?.items||[]).find(i=>i.kind==='file'&&i.type.startsWith('image/'));
    if(!item)return;
    e.preventDefault();e.stopPropagation();
    chatShowPreview(item.getAsFile());
  }
  const _chatInp=document.getElementById('chat-inp');
  if(_chatInp)_chatInp.addEventListener('paste',_pasteImg);
  document.addEventListener('paste',function(e){if(panelOpen&&msgsRef)_pasteImg(e);});

  // Tạo lightbox 1 lần
  (function(){
    const lb=document.createElement('div');
    lb.id='img-lightbox';
    lb.style.cssText='display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;align-items:center;justify-content:center;cursor:zoom-out';
    lb.innerHTML='<img id="img-lightbox-src" style="max-width:92vw;max-height:90vh;object-fit:contain;border-radius:10px">';
    lb.onclick=()=>lb.style.display='none';
    document.body.appendChild(lb);
  })();

  window.chatViewImg=function(el){
    const lb=document.getElementById('img-lightbox');
    const li=document.getElementById('img-lightbox-src');
    if(lb&&li){li.src=el.src;lb.style.display='flex';}
  };

  window.chatOpenAdmin=function(){
    const pw=prompt('Nhập mã quản trị:');
    if(pw!=='kscl2026'){if(pw!==null)alert('Sai mã!');return;}
    const adm=document.getElementById('chat-admin');
    if(adm){adm.style.display='flex';chatAdminLoad();}
  };

  function chatAdminLoad(){
    if(!db)return;
    const list=document.getElementById('chat-admin-list');
    list.innerHTML='<div style="color:#94a3b8;font-size:12.5px;text-align:center;padding:20px">Đang tải...</div>';
    db.ref('messages').limitToLast(200).once('value',snap=>{
      const msgs=snap.val()||{};
      const users={};
      Object.values(msgs).forEach(m=>{
        if(m.uid&&!users[m.uid])users[m.uid]={uid:m.uid,name:m.name||'Ẩn danh'};
      });
      list.innerHTML='';
      const ulist=Object.values(users);
      if(!ulist.length){
        list.innerHTML='<div style="color:#94a3b8;font-size:12.5px;text-align:center;padding:20px">Chưa có ai chat</div>';
        return;
      }
      ulist.forEach(u=>{
        const ov=nameOverrides[u.uid]||'';
        const row=document.createElement('div');
        row.style.cssText='border:1px solid #e0e7ff;border-radius:8px;padding:10px 12px;font-family:inherit';
        row.innerHTML=`<div style="font-size:10.5px;color:#94a3b8;margin-bottom:5px">ID: ${esc(u.uid)}</div>
          <div style="font-size:11.5px;color:#64748b;margin-bottom:6px">Tự đặt: <strong>${esc(u.name)}</strong>${ov?` &nbsp;→&nbsp; <span style="color:#4f46e5;font-weight:700">${esc(ov)}</span>`:''}</div>
          <div style="display:flex;gap:8px;align-items:center">
            <input value="${esc(ov||u.name)}" data-uid="${esc(u.uid)}"
              style="flex:1;border:1.5px solid #c7d2fe;border-radius:6px;padding:6px 10px;font-size:13px;outline:none;font-family:inherit"
              onfocus="this.style.borderColor='#4f46e5'" onblur="this.style.borderColor='#c7d2fe'">
            <button data-uid="${esc(u.uid)}" onclick="chatAdminSave(this)"
              style="padding:6px 14px;background:#4f46e5;color:#fff;border:none;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:inherit;flex-shrink:0">Lưu</button>
          </div>`;
        list.appendChild(row);
      });
    });
  }

  window.chatAdminClear=function(){
    if(!db)return;
    if(!confirm('Xóa TOÀN BỘ lịch sử chat? Hành động này không thể hoàn tác.'))return;
    db.ref('messages').remove(()=>{
      const box=document.getElementById('chat-msgs');
      box.innerHTML='<div id="chat-empty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#94a3b8;font-size:12.5px;text-align:center;padding:16px"><span style="font-size:36px">💬</span><span>Chưa có tin nhắn nào.<br>Hãy bắt đầu cuộc trò chuyện!</span></div>';
      lastDateLabel='';
      alert('Đã xóa toàn bộ lịch sử chat.');
    });
  };

  window.chatAdminSave=function(btn){
    const uid=btn.dataset.uid;
    const inp=btn.previousElementSibling;
    const name=(inp?.value||'').trim();
    if(!name||!uid||!db)return;
    db.ref('nameOverrides/'+uid).set(name,()=>{
      btn.textContent='✓ Đã lưu';btn.style.background='#16a34a';
      setTimeout(()=>{btn.textContent='Lưu';btn.style.background='#4f46e5';chatAdminLoad();},1200);
    });
  };

  window.chatShowFab=function(show){
    const fab=document.getElementById('chat-fab');
    if(fab)fab.style.display=show?'flex':'none';
  };
})();
</script>
</body>
</html>
