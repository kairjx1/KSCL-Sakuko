/* ── LARK SYNC helpers ── */
function _num(f){if(f===null||f===undefined)return 0;if(typeof f==='number')return f;if(f&&Array.isArray(f.value))return f.value[0]||0;return 0;}
function _txt(f){if(!f)return '';if(typeof f==='string')return f;if(Array.isArray(f)&&f[0])return f[0].text!=null?f[0].text:String(f[0]);return '';}
function parseLarkDate(raw){
  const monthly=(raw.monthly||[]).map(f=>({
    t:'T'+(('00'+_txt(f['Tháng']||f['Month']||'')).slice(-2)),
    dt:_num(f['Doanh thu']),gv:_num(f['Giá vốn']),tv:_num(f['Thu về']),
    huy:_num(f['Hủy']),cp:_num(f['Chi phí đổi code']),
    dinhmuc:_num(f['Định mức tối đa']),conlai:_num(f['Còn lại theo mã DG']),
  })).filter(r=>r.dt>0).sort((a,b)=>a.t>b.t?1:-1);
  const stores=(raw.stores||[]).map(f=>({
    s:_txt(f['ST']).replace(/^[^\s]+\s/,'').trim(),m:_txt(f['Mã kho']),
    dt:_num(f['Doanh thu']),cp:_num(f['Chi phí đổi code']),
    tl:_num(f['Tỷ lệ đổi code/DT']),cb:f['Cảnh báo(0.21%)']?1:0,
  })).filter(s=>s.s&&s.dt>0);
  return{monthly,stores};
}
async function syncLarkDate(btn){
  if(btn){btn.disabled=true;btn.innerHTML='⏳ Đang đồng bộ...';}
  try{
    let d=null;
    try{
      const r=await fetch('http://localhost:3002/api/sync-date',{signal:AbortSignal.timeout(90000)});
      if(r.ok){d=await r.json();if(d.error)d=null;}
    }catch(_){}
    if(!d){
      if(btn)btn.innerHTML='⏳ Lấy từ Lark...';
      const r=await fetch('/api/lark-date',{signal:AbortSignal.timeout(30000)});
      if(r.ok){const j=await r.json();if(j.ok&&j.monthly?.length)d=j;}
    }
    if(!d){
      if(btn)btn.innerHTML='⏳ Tải cache...';
      const r=await fetch('https://raw.githubusercontent.com/kairjx1/KSCL-Sakuko/main/date-cache.json?t='+Date.now());
      if(r.ok)d=await r.json();
    }
    if(!d?.monthly?.length)throw new Error('Không lấy được dữ liệu');
    localStorage.setItem('lark_date_cache',JSON.stringify({...d,ts:Date.now()}));
    S.dateCache=d;go(S.page,S.tab);
    toast('✅ Đồng bộ thành công ('+d.monthly.length+' tháng)','t-ok');
  }catch(e){
    toast('❌ Lỗi đồng bộ: '+e.message,'t-err');
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='🔄 Đồng bộ Lark';}
  }
}

/* ══ TỔNG HỢP: load all months từ QC Firebase + KK Lark caches ══ */
async function tongHopLoadAll(){
  S._thLoading=1; go(S.page,S.tab);
  try{
    const[bb,ta,xh,dc]=await Promise.all(['bbkk-cache.json','tonam-cache.json','xuathuy-cache.json','date-cache.json'].map(kkFetchCache));
    const monthSet=new Set();
    if(ta&&ta.months)Object.keys(ta.months).forEach(k=>{const m=+k.slice(1);if(m>=1&&m<=12)monthSet.add('2026/'+m);});
    if(bb&&bb.t1)bb.t1.forEach(r=>{if(r.nam&&r.thang)monthSet.add(r.nam+'/'+r.thang);});
    if(xh&&xh.data)Object.entries(xh.data).forEach(([y,ms])=>Object.keys(ms).forEach(k=>{const m=+k.slice(1);if(m>=1&&m<=12)monthSet.add(y+'/'+m);}));
    if(dc&&dc.monthly)dc.monthly.forEach(r=>{if(r.t){const m=+r.t.slice(1);if(m>=1&&m<=12)monthSet.add('2026/'+m);}});
    // add current + prev month even if no cache yet
    const _now=new Date(),_cm=_now.getMonth()||12,_cy=_cm===12?_now.getFullYear()-1:_now.getFullYear();
    monthSet.add(_cy+'/'+_cm);
    const allData={};
    for(const mk of monthSet){
      const[y,m]=mk.split('/');
      const Tm='T'+String(+m).padStart(2,'0'),pm=+m===1?12:+m-1,pTm='T'+String(pm).padStart(2,'0');
      const recs=(bb&&bb.t1||[]).filter(r=>+r.nam===+y&&+r.thang===+m);
      const taM=ta&&ta.months&&ta.months[Tm]||null;
      const taP=ta&&ta.months&&ta.months[pTm]||null;
      const xhM=xh&&xh.data&&xh.data[y]&&xh.data[y][Tm]||null;
      const dcM=(dc&&dc.monthly||[]).find(r=>r.t===Tm)||null;
      let tt=0,th=0;
      recs.forEach(r=>{const ton=(+r.denBu||0)+(+r.congtyHT||0);if(ton<0)tt+=-ton;th+=Math.abs(Math.min(0,+r.denBu||0));});
      allData[mk]={kk:{
        soBienBan:recs.length,tongThatthoat:tt,thuHoi:th,
        tongTonAm:taM?+taM.total||0:null,tongTonAmPrev:taP?+taP.total||0:null,
        xuathuyValue:xhM?+xhM.value||0:null,xuathuyQty:xhM?+xhM.qty||0:null,
        doanhThu:dcM?+dcM.dt||0:null,
      }};
    }
    // QC từ Firebase — batch check tất cả months
    const qcdb=getQCDB();
    if(qcdb){
      await Promise.all([...monthSet].map(async mk=>{
        const[y,m]=mk.split('/');
        try{
          const[dS,dtS,glS]=await Promise.all([
            qcdb.ref('qc_diem/'+y+'/'+m).get(),
            qcdb.ref('qc_doitra/'+y+'/'+m).get(),
            qcdb.ref('qc_gianlantctm/'+y+'/'+m).get()
          ]);
          if(!dS.exists())return;
          const diem=dS.val(),dt=(dtS.exists()?dtS.val():{}).st||{};
          const gl=glS.exists()?glS.val():null;
          const pct=r=>{const mx=parseFloat(r.max),th=parseFloat(r.thuc);return mx>0&&isFinite(th)?+(th/mx*100).toFixed(2):null;};
          let sum=0,cnt=0;
          (diem.rows||[]).forEach(r=>{const c=pct(r);if(c!=null){sum+=c;cnt++;}});
          const allLoi={...(gl&&gl.dk&&gl.dk.loiVPs||{})};
          for(const[k,v]of Object.entries(gl&&gl.ctkm&&gl.ctkm.loiVPs||{}))allLoi[k]=(allLoi[k]||0)+v;
          const topLoi=Object.entries(allLoi).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>({k,v}));
          allData[mk].qc={
            diemTB:cnt?+(sum/cnt).toFixed(2):0,tongLuot:cnt,
            tongDoitra:+dt.tongDon||0,pctST:+dt.pctST||0,pctKhach:+dt.pctKhach||0,
            soKiemTra:+((gl&&gl.dk&&gl.dk.total)||0),soSTLoi:+((gl&&gl.dk&&gl.dk.cgt)||0),
            topLoi,
          };
        }catch(e){}
      }));
    }
    const sortedKeys=Object.keys(allData).filter(k=>allData[k].qc||allData[k].kk.soBienBan||allData[k].kk.tongTonAm!=null).sort((a,b)=>{const[ya,ma]=a.split('/'),[yb,mb]=b.split('/');return(+ya*12+ +ma)-(+yb*12+ +mb);});
    S.tongHopAllData={months:allData,sortedKeys,ts:Date.now()};
    if(!S.tongHopMonth||!allData[S.tongHopMonth])S.tongHopMonth=sortedKeys[sortedKeys.length-1]||'';
  }catch(e){console.error(e);}
  S._thLoading=0; go(S.page,S.tab);
}

function showImport(mod){showModal('import',{mod});}
function doDrop(e,mod){e.preventDefault();e.target.closest('.dz').classList.remove('over');const f=e.dataTransfer.files[0];if(f)processFile(f,mod,'ir2');}
function doFile(el,mod){if(el.files[0])processFile(el.files[0],mod,'ir2');}

function processFile(file,mod,resId){
  const res=document.getElementById(resId);
  if(res)res.innerHTML=`<div class="alert a-info"><span class="a-ic">⏳</span><div class="a-bd"><strong>Đang đọc file...</strong><p>${file.name}</p></div></div>`;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws);
      if(!data.length){if(res)res.innerHTML=`<div class="alert a-warn"><span class="a-ic">⚠️</span><div class="a-bd"><strong>File rỗng</strong><p>Sheet đầu tiên không có dữ liệu.</p></div></div>`;return;}
      saveImport(mod,data,file.name,res);
    }catch(err){
      if(res)res.innerHTML=`<div class="alert a-err"><span class="a-ic">❌</span><div class="a-bd"><strong>Lỗi đọc file</strong><p>${err.message}</p></div></div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function saveImport(mod,data,fname,resEl){
  db.ref(`imports/${S.user.uid}/${mod}`).set({data,fname,at:Date.now(),by:S.profile?.name||S.user.email}).then(()=>{
    S.data[mod]=data;
    if(resEl)resEl.innerHTML=`<div class="alert a-ok"><span class="a-ic">✅</span><div class="a-bd"><strong>Import thành công: ${data.length} dòng</strong><p>File: ${fname} — Biểu đồ đã cập nhật tự động.</p></div></div>`;
    toast(`✅ Import ${data.length} dòng thành công`,'t-ok');
    checkAlerts(mod,data);
    updateChartFromData(mod,data);
  }).catch(e=>{
    if(resEl)resEl.innerHTML=`<div class="alert a-err"><span class="a-ic">❌</span><div class="a-bd"><strong>Lỗi lưu dữ liệu</strong><p>${e.message}</p></div></div>`;
  });
}

function checkAlerts(mod,data){
  const warns=[];
  data.forEach((row,i)=>{
    if(mod==='qc'){
      const temp=parseFloat(row['Nhiệt độ']||row['nhiet_do']||row['temperature']||0);
      const rate=parseFloat(row['Tỉ lệ lỗi']||row['ti_le_loi']||row['error_rate']||0);
      if(temp>7)warns.push(`Hàng ${i+2}: Nhiệt độ ${temp}°C — NGHIÊM TRỌNG!`);
      else if(temp>4)warns.push(`Hàng ${i+2}: Nhiệt độ ${temp}°C — Cảnh báo`);
      if(rate>5)warns.push(`Hàng ${i+2}: Tỉ lệ lỗi ${rate}% — NGHIÊM TRỌNG!`);
      else if(rate>2)warns.push(`Hàng ${i+2}: Tỉ lệ lỗi ${rate}% — Cảnh báo`);
    }
    if(mod==='kk'){
      const cl=parseFloat(row['Chênh lệch %']||row['chenh_lech']||0);
      if(cl>5)warns.push(`Hàng ${i+2}: Chênh lệch ${cl}% — NGHIÊM TRỌNG!`);
      else if(cl>2)warns.push(`Hàng ${i+2}: Chênh lệch ${cl}% — Cảnh báo`);
    }
  });
  if(warns.length){
    toast(`⚠️ ${warns.length} cảnh báo vượt ngưỡng!`,'t-warn');
    db.ref(`alerts/${S.user.uid}/${mod}`).set({warns,at:Date.now()});
  }
}

function updateChartFromData(mod,data){
  // Build month labels & series from imported data if columns match
  try{
    const byMonth={};
    data.forEach(r=>{
      const d=r['Ngày']||r['ngay']||r['date'];
      if(!d)return;
      const m=new Date(d).getMonth();
      if(isNaN(m))return;
      const lb=`T${m+1}`;
      byMonth[lb]=(byMonth[lb]||0)+1;
    });
    const labels=Object.keys(byMonth),vals=Object.values(byMonth);
    const cid=mod==='kk'?'c-kk-bar':mod==='qc'?'c-qc-trend':'c-bc-bar';
    const ch=S.charts[cid];
    if(ch&&labels.length){ch.data.labels=labels;ch.data.datasets[0].data=vals;ch.update();}
  }catch(e){}
}

/* Tải Executive QC: LUÔN tổng hợp tự động từ nghiệp vụ; fallback qc_data cũ nếu chưa có */
async function qcLoadExecAndRefresh(year,month){
  const m=String(month||S.qcExecMonth||'5');
  const y=String(year||S.qcExecYear||'2026');
  S.qcExecMonth=m;S.qcExecYear=y;
  if(m==='all'){
    if(!S.tongHopAllData)await tongHopLoadAll();
    const ms=S.tongHopAllData?.months||{};
    const ks=Object.keys(ms).filter(k=>k.startsWith(y+'/')&&ms[k].qc);
    if(!ks.length){S.qcExecData=null;go('baocao',S.tab);return;}
    let sd=0,cd=0,sdt=0,sl=0,skt=0,sloi=0;
    ks.forEach(k=>{const q=ms[k].qc;if(q.diemTB!=null){sd+=q.diemTB;cd++;}sdt+=q.tongDoitra||0;sl+=q.tongLuot||0;skt+=q.soKiemTra||0;sloi+=q.soSTLoi||0;});
    S.qcExecData={s1_diemtb:cd?+(sd/cd).toFixed(2):0,s1_tongluot:sl,s1_stores:{},s1_storeNames:[],s1_loi:[],s2_tongdon:sdt,s2_pct_st:0,s2_pct_khach:0,s2_pct_khac:0,s3_tongST:skt,s3_soSTLoi:sloi,s3_stLoi:[],_allYear:true,_kkAgg:ks.length+' tháng',savedAt:Date.now()};
    go('baocao',S.tab);return;
  }
  const qcdb=getQCDB();
  if(!qcdb){alert('Không kết nối được Firebase');return;}
  try{
    let data=await qcBuildExec(qcdb,y,m);
    if(!data){const snap=await qcdb.ref(`qc_data/${y}/${m}`).get();data=snap.exists()?snap.val():null;}
    S.qcExecData=data;
    go('baocao',S.tab||'Executive QC');
    if(!data)setTimeout(()=>{const b=document.querySelector('.sec-hdr');if(b){const n=document.createElement('div');n.style.cssText='background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 16px;margin-top:10px;font-size:13px;color:#dc2626';n.textContent=`⚠️ Chưa có dữ liệu T${m}/${y} — vào mục QC → Chấm điểm dịch vụ nhập/import điểm tháng này.`;b.after(n);setTimeout(()=>n.remove(),5000);}},200);
  }catch(e){console.error(e);alert('Lỗi tải dữ liệu: '+e.message);}
}
/* Tổng hợp từ nghiệp vụ QC (qc_diem + qc_doitra + qc_gianlantctm/gl-cache) → cấu trúc exec */
async function qcBuildExec(qcdb,y,m){
  const pm=+m===1?'12':String(+m-1),py=+m===1?String(+y-1):y;
  const[dS,dPS,dtS,glS]=await Promise.all([
    qcdb.ref(`qc_diem/${y}/${m}`).get(),qcdb.ref(`qc_diem/${py}/${pm}`).get(),
    qcdb.ref(`qc_doitra/${y}/${m}`).get(),qcdb.ref(`qc_gianlantctm/${y}/${m}`).get()
  ]);
  const diem=dS.exists()?dS.val():null;
  if(!diem||!Array.isArray(diem.rows)||!diem.rows.length)return null;
  const pct=r=>{const mx=parseFloat(r.max),th=parseFloat(r.thuc);return mx>0&&isFinite(th)?+(th/mx*100).toFixed(2):null;};
  const prevMap={};((dPS.exists()?dPS.val():{}).rows||[]).forEach(r=>{const p=pct(r);if(p!=null)prevMap[r.st]=p;});
  const stores={},names=[];let sum=0,cnt=0;
  diem.rows.forEach((r,i)=>{const c=pct(r);names.push(r.st);stores['st'+i]={name:r.st,prev:prevMap[r.st]!=null?prevMap[r.st]:null,curr:c};if(c!=null){sum+=c;cnt++;}});
  const loi=(diem.loiHM||[]).slice().sort((a,b)=>(+b.soLoi||0)-(+a.soLoi||0)).slice(0,3).map(l=>({ten:l.cat||'',soST:+l.soLoi||0})).filter(l=>l.ten);
  const dt=(dtS.exists()?dtS.val():{}).st||{};
  let gl=glS.exists()?glS.val():null;
  if(!gl){try{const r=await fetch('gl-cache.json?_='+Date.now());if(r.ok){const j=await r.json();gl=j.agg&&j.agg[`${y}/${m}`]||null;}}catch(e){}}
  const dk=gl&&gl.dk||{},ctkm=gl&&gl.ctkm||{};
  const allLoi={...(dk.loiVPs||{})};for(const[k,v]of Object.entries(ctkm.loiVPs||{}))allLoi[k]=(allLoi[k]||0)+v;
  const stLoi=Object.entries(allLoi).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({name:k,loi:v+' lần'}));
  const k2=+dt.pctKhach||0,s2=+dt.pctST||0;
  const auto='Tự động tổng hợp '+new Date().toLocaleString('vi-VN');
  return{
    s1_storeNames:names,s1_tongluot:cnt,s1_diemtb:cnt?+(sum/cnt).toFixed(2):0,
    s1_stores:stores,s1_loi:loi,s1_note:`${auto} · QC → Chấm điểm dịch vụ (${cnt}/${names.length} ST, so với T${pm}/${py})`,
    s2_tongdon:+dt.tongDon||0,s2_pct_khach:k2,s2_pct_st:s2,s2_pct_khac:+Math.max(0,100-k2-s2).toFixed(2),
    s2_topST:(dt.top||[]).map(t=>({name:t.name,count:+t.don||0})),
    s2_note:dtS.exists()?`${auto} · QC → Đổi trả (Siêu thị)`:'⚠️ Chưa có dữ liệu Đổi trả tháng này',
    s3_tongST:+dk.total||0,s3_soSTLoi:+dk.cgt||0,s3_stLoi:stLoi,
    s3_note:gl?`${auto} · Check gian lận: ĐK ${dk.total||0} check/${dk.cgt||0} cần GT · CTKM ${ctkm.total||0}/${ctkm.cgt||0}`:'⚠️ Chưa đồng bộ Check gian lận tháng này',
    savedAt:Date.now(),_autoAgg:true
  };
}
/* ⚡ Nút tổng hợp thủ công: build + lưu snapshot vào qc_data */
async function qcAggFromModules(btn){
  const m=String(document.getElementById('exec-m')?.value||S.qcExecMonth||'5');
  const y=String(document.getElementById('exec-y')?.value||S.qcExecYear||'2026');
  const qcdb=getQCDB();if(!qcdb){alert('Không kết nối được Firebase');return;}
  if(btn){btn.disabled=true;btn.textContent='⏳ Đang tổng hợp...';}
  const done=()=>{if(btn){btn.disabled=false;btn.textContent='⚡ Tổng hợp từ Nghiệp vụ';}};
  try{
    const data=await qcBuildExec(qcdb,y,m);

async function kkAutoAgg(year,month){
  const m=String(month||S.kkExecMonth||'5'),y=String(year||S.kkExecYear||'2026');
  const[bb,ta,xh,dc]=await Promise.all(['bbkk-cache.json','tonam-cache.json','xuathuy-cache.json','date-cache.json'].map(kkFetchCache));
  const Tm='T'+m.padStart(2,'0'),pm=+m===1?12:+m-1,pTm='T'+String(pm).padStart(2,'0');
  const recs=(bb&&bb.t1||[]).filter(r=>+r.nam===+y&&+r.thang===+m);
  let tt=0,th=0;
  const bienBan=recs.map(r=>{
    const ton=(+r.denBu||0)+(+r.congtyHT||0);
    const denBu=Math.abs(Math.min(0,+r.denBu||0));
    if(ton<0)tt+=-ton;th+=denBu;
    const d=r.ngay?new Date(+r.ngay):null;
    return{st:(r.tenST||r.ten||'').replace(/^S\d+_/,''),ngay:d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'):'',loai:r.loai||'',denBu,ton,risk:ton<-5e6?'R2':ton<-1e6?'R1':ton>0?'ok':'W'};
  }).sort((a,b)=>a.ton-b.ton);
  const kkTong=recs.filter(r=>/tổng/i.test(r.loai||'')).length;
  const taM=ta&&ta.months&&ta.months[Tm]||null,taP=ta&&ta.months&&ta.months[pTm]||null;
  const xhM=xh&&xh.data&&xh.data[y]&&xh.data[y][Tm]||null;
  const dcM=(dc&&dc.monthly||[]).find(r=>r.t===Tm)||null;
  const t4Rec=(bb&&bb.t4||[]).find(r=>+r.nam===+y&&+r.thang===+m);
  if(!recs.length&&!taM&&!xhM){S.kkExecData=null;S.kkExecMonth=m;S.kkExecYear=y;go(S.page,S.tab);return;}
  const ttByST={};bienBan.forEach(b=>{if(b.ton<0)ttByST[b.st]=(ttByST[b.st]||0)+b.ton;});
  const _taStores=taM&&taM.stores||[];
  const _taStoreNm=new Set(_taStores.map(s=>(s.ten||'').replace(/^SKK\s*/,'')));
  const _extraST=Object.keys(ttByST).filter(nm=>nm&&!_taStoreNm.has(nm)).map(nm=>({st:nm,thatthoat:ttByST[nm]||0,ratio:0,tonAmSKU:0,note:'Biên bản KK '+((ttByST[nm]||0)/1e6).toFixed(1)+'M₫'}));
  const s3=[..._taStores.map(s=>{const nm=(s.ten||'').replace(/^SKK\s*/,'');return{st:nm,thatthoat:ttByST[nm]||0,ratio:0,tonAmSKU:+s.count||0,note:'Tồn âm '+(+s.count||0)+' SKU · GT '+((+s.value||0)/1e6).toFixed(1)+'M₫'+(ttByST[nm]?' · BBKK '+(ttByST[nm]/1e6).toFixed(1)+'M₫':'')};}),..._extraST];
  S.kkExecData={
    s1_doanhThu:(dcM&&+dcM.dt)||(t4Rec&&+t4Rec.dt)||0,
    s1_soBienBan:recs.length,s1_kkTong:kkTong,s1_kkDotXuat:recs.length-kkTong,
    s1_tongThatthoat:tt,s1_thuHoi:th,
    s1_note:'Tự động từ Lark: '+recs.length+' biên bản KK'+(xhM?' · Xuất hủy '+((+xhM.value||0)/1e6).toFixed(1)+'M₫/'+(xhM.total||0)+' phiếu':''),
    s2_tongTonAm:taM?+taM.total||0:0,s2_tongTonAmPrev:taP?+taP.total||0:0,
    s2_banNhamMa:0,s2_chuaGiaiTrinh:taM?(+taM.qh||0)+(+taM.ch||0):0,s2_chuaGiaiTrinhPrev:taP?(+taP.qh||0)+(+taP.ch||0):0,
    s2_chuaNhanDon:0,s2_gtThua:0,s2_gtThieu:0,s2_soSTVuotNguong:0,
    s2_note:'Tồn âm tự động từ Lark'+(taM?' · GT '+((+taM.totalValue||0)/1e9).toFixed(2)+' tỷ₫':''),
    s3_stores:s3,s3_note:'Top tồn âm theo ST — tự động từ Lark',
    bienBan,xuathuy:xhM?{value:+xhM.value||0,total:+xhM.total||0,qty:+xhM.qty||0}:null,
    savedAt:Date.now(),_auto:true
  };
  S.kkExecMonth=m;S.kkExecYear=y;
  go(S.page,S.tab);
}

function qcImportExcel(input){
  const file=input.files[0];if(!file)return;
  input.value='';
  const run=()=>qcParseExcel(file);
  if(!window.XLSX){const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=run;document.head.appendChild(s);}
  else run();
}
function qcParseExcel(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).filter(r=>r[0]&&String(r[0]).trim());
      if(!rows.length){alert('Không tìm thấy dữ liệu trong file!');return;}
      const start=isNaN(parseFloat(rows[0][1]))?1:0;
      const data=rows.slice(start);
      if(!data.length){alert('File chỉ có hàng tiêu đề, không có dữ liệu!');return;}
      qcStoreList=data.map(r=>String(r[0]).trim());
      qcSaveStoreConfig();qcRenderStoreTable();
      setTimeout(()=>{
        data.forEach((r,i)=>{
          const p=document.getElementById(`s1-st${i}-prev`);
          const c=document.getElementById(`s1-st${i}-curr`);
          if(p&&r[1]!=='')p.value=r[1];
          if(c&&r[2]!=='')c.value=r[2];
        });
      },60);
      alert(`✅ Đã nhập ${data.length} siêu thị từ file Excel!`);
    }catch(err){alert('Lỗi đọc file: '+err.message);}
  };
  reader.readAsBinaryString(file);
}

function toggleHistPanel(type){
  const panel=document.getElementById('hist-'+type+'-panel');
  if(!panel)return;
  if(panel.style.display!=='none'&&panel.style.display!==''){panel.style.display='none';return;}
  const m=document.getElementById(type==='qc'?'qc-month':'kk-month')?.value;
  const y=document.getElementById(type==='qc'?'qc-year':'kk-year')?.value;
  if(!m||!y){alert('Chọn tháng/năm trước!');return;}
  panel.style.display='block';
  panel.innerHTML='<div style="padding:10px;text-align:center;color:var(--t3);font-size:12px">⏳ Đang tải lịch sử...</div>';
  const refdb=type==='qc'?getQCDB():getKKDB();
  if(!refdb){panel.innerHTML='<div style="padding:10px;color:#dc2626;font-size:12px">Không kết nối được Firebase</div>';return;}
  const histPath=type==='qc'?`qc_history/${y}/${m}`:`kk_history/${y}/${m}`;
  refdb.ref(histPath).orderByKey().limitToLast(10).get().then(snap=>{
    if(!snap.exists()){panel.innerHTML='<div style="padding:10px;color:var(--t3);font-size:12px;text-align:center">Chưa có lịch sử lưu cho tháng '+m+'/'+y+'.<br>Lịch sử sẽ được ghi tự động từ lần lưu tiếp theo.</div>';return;}
    const rows=[];
    snap.forEach(child=>{
      const d=child.val(),k=child.key;
      const ts=d._snapshotAt||parseInt(k)||0;
      const dt=ts?new Date(ts).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'N/A';
      const by=d._by||'N/A';
      const savedAt=d.savedAt?new Date(d.savedAt).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
      rows.unshift(`<tr style="border-bottom:1px solid rgba(0,0,0,.06)">
        <td style="padding:7px 10px;font-size:12px"><span style="font-weight:600">${dt}</span>${savedAt?`<br><span style="font-size:11px;color:var(--t3)">Dữ liệu tháng: ${savedAt}</span>`:''}</td>
        <td style="padding:7px 10px;font-size:12px;color:var(--t2)">${by}</td>
        <td style="padding:7px 10px;text-align:center"><button onclick="restoreHistory('${type}','${y}','${m}','${k}')" style="padding:4px 12px;font-size:11.5px;border:1px solid #1a2558;color:#1a2558;background:#fff;border-radius:6px;cursor:pointer;white-space:nowrap">↩ Khôi phục</button></td>
      </tr>`);
    });
    panel.innerHTML=`<div style="font-size:11px;color:var(--t3);padding:6px 10px;background:rgba(234,179,8,.08);border-radius:5px;margin-bottom:8px">⚠️ Khôi phục chỉ điền lại form — dữ liệu <strong>chưa được ghi đè</strong> cho đến khi bạn bấm Lưu.</div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:rgba(0,0,0,.04)">
        <th style="padding:7px 10px;text-align:left;font-size:11px;color:var(--t2);font-weight:600">Thời điểm snapshot</th>
        <th style="padding:7px 10px;text-align:left;font-size:11px;color:var(--t2);font-weight:600">Người lưu</th>
        <th style="padding:7px 10px;font-size:11px;color:var(--t2);font-weight:600">Thao tác</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;
  }).catch(e=>{panel.innerHTML=`<div style="padding:10px;color:#dc2626;font-size:12px">Lỗi tải lịch sử: ${e.message}</div>`;});
}
function restoreHistory(type,y,m,key){
  if(!confirm('Khôi phục bản này vào form? Dữ liệu hiện tại trên form sẽ bị thay thế (chưa lưu).'))return;
  const refdb=type==='qc'?getQCDB():getKKDB();if(!refdb)return;
  const histPath=type==='qc'?`qc_history/${y}/${m}/${key}`:`kk_history/${y}/${m}/${key}`;
  refdb.ref(histPath).get().then(snap=>{
    if(!snap.exists()){alert('Không tìm thấy bản lưu này.');return;}
    const d=snap.val();
    if(type==='qc')_fillQCForm(d);
    else _fillKKForm(d);
    const ts=d._snapshotAt?new Date(d._snapshotAt).toLocaleString('vi-VN'):'N/A';
    toast('✅ Đã khôi phục bản lưu lúc '+ts+' — kiểm tra lại rồi bấm Lưu nếu muốn ghi đè.','t-ok');
  }).catch(e=>alert('Lỗi khôi phục: '+e.message));
}
function kkCalcKK(){
  const tt=parseFloat(document.getElementById('kk-s1-tongTT')?.value)||0;
  const tr=parseFloat(document.getElementById('kk-s1-thuHoi')?.value)||0;
  const dt=parseFloat(document.getElementById('kk-s1-doanhThu')?.value)||0;
  const fmt=v=>v.toLocaleString('vi-VN');
  document.getElementById('kk-s1-tonRong').textContent=tt>0?fmt(tt-tr)+'₫':'—';
  document.getElementById('kk-s1-pctTR').textContent=tt>0?(tr/tt*100).toFixed(1)+'%':'—';
  document.getElementById('kk-s1-pctTT').textContent=dt>0?(tt/dt*100).toFixed(3)+'%':'—';
}
function kkCalcTonAm(){
  const now=parseInt(document.getElementById('kk-s2-tongTonAm')?.value)||0;
  const prev=parseInt(document.getElementById('kk-s2-tongTonAmPrev')?.value)||0;
  const pct=prev>0?+((now-prev)/prev*100).toFixed(1):0;
  document.getElementById('kk-s2-pctTaD').textContent=prev>0?(pct>0?'+'+pct+'% ⚠️':pct+'% ✅'):'—';
}
function kkCalcEbit(){
  const thua=parseFloat(document.getElementById('kk-s2-gtThua')?.value)||0;
  const thieu=parseFloat(document.getElementById('kk-s2-gtThieu')?.value)||0;
  const rong=thua-thieu;const fmt=v=>(v/1e6).toFixed(1)+'M₫';
  document.getElementById('kk-s2-thuaD').textContent=thua>0?'+'+fmt(thua):'—';
  document.getElementById('kk-s2-thieuD').textContent=thieu>0?'-'+fmt(thieu):'—';
  const el=document.getElementById('kk-s2-ebitD');
  if(el){el.textContent=(thua||thieu)?fmt(rong):'—';el.style.color=rong<0?'#dc2626':rong>0?'#16a34a':'#6b7280';}
}

async function doLogin(){
  const email=document.getElementById('le')?.value?.trim();
  const pass=document.getElementById('lp')?.value;
  const errEl=document.getElementById('lerr');
  if(!email||!pass){if(errEl)errEl.innerHTML=`<div class="err-box">Vui lòng nhập email và mật khẩu</div>`;return;}
  try{
    await auth.signInWithEmailAndPassword(email,pass);
  }catch(e){
    const M={'auth/user-not-found':'Email không tồn tại trong hệ thống','auth/wrong-password':'Mật khẩu không đúng','auth/invalid-email':'Email không hợp lệ','auth/too-many-requests':'Quá nhiều lần thử. Vui lòng đợi vài phút.','auth/invalid-credential':'Email hoặc mật khẩu không đúng'};
    if(errEl)errEl.innerHTML=`<div class="err-box">${M[e.code]||e.message}</div>`;
  }
}
async function doLogout(){await auth.signOut();S.user=null;S.profile=null;S.data={};go('login');}

/* ── Lark OAuth login ── */
async function doLarkAcademyLogin(){
  try{
    const base=window.location.href.split('?')[0];
    const r=await fetch(`/api/lark-oauth?action=login_url&redirect=${encodeURIComponent(base)}&state=academy`);
    const j=await r.json();
    if(j.ok)window.location.href=j.url;
    else{const el=document.getElementById('lerr');if(el)el.innerHTML=`<div class="err-box">Lỗi: ${j.error||'Không lấy được URL đăng nhập'}</div>`;}
  }catch(e){const el=document.getElementById('lerr');if(el)el.innerHTML=`<div class="err-box">${e.message}</div>`;}
}

async function handleAcademyLarkCallback(code){
  // Exchange code for Lark user info
  const r=await fetch(`/api/lark-oauth?action=callback&code=${code}`);
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Lỗi xác thực Lark');
  const lu=j.user;
  if(!lu.email)throw new Error('Tài khoản Lark chưa có email — liên hệ Admin');
  // Store Lark profile for onAuthStateChanged to use
  S.pendingLarkUser={name:lu.name||lu.email,email:lu.email,open_id:lu.open_id,avatar:lu.avatar||''};
  // Firebase sign-in with deterministic password
  const pwd=`KSCL_${lu.open_id}`;
  try{
    await auth.signInWithEmailAndPassword(lu.email,pwd);
  }catch(e){
    if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'){
      try{await auth.createUserWithEmailAndPassword(lu.email,pwd);}
      catch(e2){
        if(e2.code==='auth/email-already-in-use')throw new Error('Email này đã có tài khoản riêng. Vui lòng đăng nhập bằng email/mật khẩu hoặc liên hệ Admin để liên kết.');
        throw e2;
      }
    }else throw e;
  }
  // onAuthStateChanged will fire and handle profile creation
}

  S.profile.phone=document.getElementById('fl-p')?.value||'';
  await db.ref(`profiles/${S.user.uid}`).set(S.profile);
  closeModal(); go('dashboard');

async function doAddUser(){
  const email=document.getElementById('au-e')?.value?.trim();
  const pass=document.getElementById('au-p')?.value;
  const name=document.getElementById('au-n')?.value?.trim();
  const role=document.getElementById('au-r')?.value;

  if(!email||!pass||!name){if(errEl)errEl.innerHTML=`<div class="err-box">Vui lòng điền đầy đủ thông tin bắt buộc (*)</div>`;return;}
  try{
    // Dùng REST API để tạo user mà không ảnh hưởng session hiện tại
    const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass,returnSecureToken:false})
    });
    const data=await res.json();
    if(data.error){
      const M={'EMAIL_EXISTS':'Email này đã có tài khoản','WEAK_PASSWORD':'Mật khẩu quá yếu (tối thiểu 6 ký tự)','INVALID_EMAIL':'Email không hợp lệ'};
      const msg=data.error.message||'';
      throw new Error(M[msg]||M[msg.split(' ')[0]]||msg);

    await db.ref(`profiles/${data.localId}`).set({name,email,role,dept,phone:'',createdAt:Date.now()});
    closeModal(); toast(`✅ Đã tạo tài khoản: ${name}`,'t-ok'); loadUsers();

/* ══════════════════════════════════════════
   TREE EDITOR ENGINE
══════════════════════════════════════════ */
let TC={};   // cache: key → nodes[]
let TO={};   // open state: nodeId → bool

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function tLoad(key){
  const snap=await db.ref(`trees/${key}`).get();
  TC[key]=snap.exists()?(snap.val()||[]):[];
  return TC[key];
}
async function tSave(key){await db.ref(`trees/${key}`).set(TC[key]||[]);}

function tRender(key,nodes,editable){
  function level(pid){
    const items=(nodes||[]).filter(n=>(n.pid||null)===pid).sort((a,b)=>a.ord-b.ord);
    if(!items.length)return editable?`<div class="te-empty-node">📂 Thư mục rỗng – dùng nút + để thêm</div>`:`<div class="te-empty-node">Chưa có nội dung</div>`;
    return items.map(n=>{
      const isF=n.t==='f';
      const open=TO[n.id];
      const hasKids=nodes.some(x=>x.pid===n.id);
      const ic=isF?(open?'📂':'📁'):(n.ic||'📄');
      return`<div>
        <div class="te-row" onclick="tToggle('${key}','${n.id}',${isF})">
          <span class="te-arr ${(!isF||!hasKids)?'h':''} ${open?'o':''}">▶</span>
          <span class="te-ico">${ic}</span>
          <span class="te-lbl">${escH(n.lb)}</span>
          ${editable?`<div class="te-act" onclick="event.stopPropagation()">
            ${isF?`<button class="ta-btn ta-add" title="Thêm thư mục con" onclick="tAdd('${key}','${n.id}','f')">📁</button>
                   <button class="ta-btn ta-add" title="Thêm mục" onclick="tAdd('${key}','${n.id}','i')">📄</button>`:''}
            <button class="ta-btn ta-ren" title="Đổi tên" onclick="tRen('${key}','${n.id}')">✏️</button>
            <button class="ta-btn ta-del" title="Xóa" onclick="tDel('${key}','${n.id}')">🗑</button>
          </div>`:''}
        </div>
        ${isF&&open?`<div class="te-children">${level(n.id)}</div>`:''}
        ${!isF&&open&&n.content?`<div class="te-leaf-content">${escH(n.content)}</div>`:''}
      </div>`;
    }).join('');
  }
  return`<div class="tree-ed">
    ${editable?`<div class="te-bar">
      <span style="font-size:12px;font-weight:700;color:var(--t2);align-self:center">Admin:</span>
      <button class="btn b-ok2 b-sm" onclick="tAdd('${key}',null,'f')">📁 + Thư mục</button>
      <button class="btn b-pri b-sm" onclick="tAdd('${key}',null,'i')">📄 + Mục</button>
    </div>`:''}
    <div style="padding:6px" id="tree-inner-${key}">${level(null)}</div>
  </div>`;
}

function tReRender(key){
  const el=document.getElementById(`tree-${key}`);
  if(el)el.innerHTML=tRender(key,TC[key]||[],isAdmin());
}

function tToggle(key,id,isF){
  if(!isF)return;
  TO[id]=!TO[id];
  tReRender(key);
}

function tAdd(key,pid,type){
  const prompt_text=type==='f'?'Tên thư mục mới:':'Tên mục mới:';
  const lb=prompt(prompt_text,'');
  if(!lb||!lb.trim())return;
  const nodes=TC[key]||[];
  const siblings=nodes.filter(n=>(n.pid||null)===(pid||null));
  nodes.push({id:'n'+Date.now(),lb:lb.trim(),ic:type==='f'?'📁':'📄',t:type,pid:pid||null,ord:siblings.length,content:''});
  TC[key]=nodes;
  if(pid)TO[pid]=true;
  tSave(key).then(()=>{tReRender(key);toast(`✅ Đã thêm: ${lb.trim()}`,'t-ok');});
}

function tDel(key,id){
  const nodes=TC[key]||[];
  const node=nodes.find(n=>n.id===id);
  if(!node)return;
  const hasKids=nodes.some(n=>n.pid===id);
  const msg=hasKids?`Xóa "${node.lb}" và toàn bộ mục con?`:`Xóa "${node.lb}"?`;
  if(!confirm(msg))return;
  const rm=new Set([id]);
  let changed=true;
  while(changed){changed=false;nodes.forEach(n=>{if(rm.has(n.pid)&&!rm.has(n.id)){rm.add(n.id);changed=true;}});}
  TC[key]=nodes.filter(n=>!rm.has(n.id));
  tSave(key).then(()=>{tReRender(key);toast(`Đã xóa: ${node.lb}`,'t-ok');});
}

function tRen(key,id){
  const nodes=TC[key]||[];
  const node=nodes.find(n=>n.id===id);
  if(!node)return;
  const newLb=prompt('Đổi tên:',node.lb);
  if(!newLb||newLb===node.lb)return;
  node.lb=newLb.trim();
  tSave(key).then(()=>{tReRender(key);toast(`Đã đổi tên: ${newLb}`,'t-ok');});
}

// Wrapper: render tree section, auto-load if not cached
function tSection(key){
  if(TC[key]!==undefined){
    return`<div id="tree-${key}">${tRender(key,TC[key],isAdmin())}</div>`;
  }
  // async load then inject
  setTimeout(()=>{
    tLoad(key).then(nodes=>{
      const el=document.getElementById(`tree-${key}`);
      if(el)el.innerHTML=tRender(key,nodes,isAdmin());
    });
  },0);
  return`<div id="tree-${key}"><div style="padding:20px;text-align:center;color:var(--t2);font-size:13px">⏳ Đang tải...</div></div>`;
}

/* ══════════════════════════════════════════
   JSZip xlsx helpers — viết trực tiếp vào XML
   giữ nguyên 100% style/border/merge gốc
══════════════════════════════════════════ */
function _xlCol(n){let r='';n++;while(n>0){n--;r=String.fromCharCode(65+n%26)+r;n=Math.floor(n/26);}return r;}
function _ex(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function _xlSheetPath(zip,name){
  const wb=await zip.file('xl/workbook.xml').async('text');
  const rl=await zip.file('xl/_rels/workbook.xml.rels').async('text');
  const escaped=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/&/g,'&amp;');
  const nm=wb.match(new RegExp(`<sheet[^>]+name="${escaped}"[^>]+r:id="([^"]+)"`));
  if(!nm)return null;
  const fm=rl.match(new RegExp(`<Relationship[^>]+Id="${nm[1]}"[^>]+Target="([^"]+)"`));
  if(!fm)return null;
  const t=fm[1];
  return t.startsWith('/')?t.slice(1):t.startsWith('worksheets/')?`xl/${t}`:`xl/worksheets/${t}`;
}

function _xlColIdx(s){let n=0;for(let i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);return n-1;}
function _xlSetCell(xml,rowIdx,colIdx,value,type){
  const r=rowIdx+1, c=_xlCol(colIdx), ref=c+r;
  const cell=type==='n'
    ?`<c r="${ref}"><v>${value}</v></c>`
    :`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${_ex(String(value))}</t></is></c>`;
  const rowStart=xml.indexOf(`<row r="${r}"`);
  if(rowStart<0)return xml.replace('</sheetData>',`<row r="${r}">${cell}</row></sheetData>`);
  const rowEnd=xml.indexOf('</row>',rowStart);
  if(rowEnd<0)return xml;
  const rowSlice=xml.slice(rowStart,rowEnd);
  // Nếu cell đã tồn tại trong row — replace
  const cellPos=rowSlice.indexOf(`r="${ref}"`);
  if(cellPos>=0){
    const absPos=rowStart+cellPos;
    const cs=xml.lastIndexOf('<c ',absPos);
    if(cs>=rowStart){
      const tagEnd=xml.indexOf('>',cs);
      if(tagEnd>=0){
        const isSelf=xml[tagEnd-1]==='/';
        const ce=isSelf?tagEnd+1:xml.indexOf('</c>',tagEnd)+4;
        if(ce>0)return xml.slice(0,cs)+cell+xml.slice(ce);
      }
    }
  }
  // Cell chưa tồn tại — insert đúng vị trí theo thứ tự cột tăng dần
  const pat=/<c r="([A-Z]+)\d+"/g;
  let insertAt=rowEnd;
  let m;
  while((m=pat.exec(rowSlice))!==null){
    if(_xlColIdx(m[1])>colIdx){
      const abs=rowStart+m.index;
      const cs=xml.lastIndexOf('<c ',abs);
      if(cs>=rowStart){insertAt=cs;}
      break;
    }
  }
  return xml.slice(0,insertAt)+cell+xml.slice(insertAt);
}

async function _xlApply(origBuf,sheetUpdates){
  // sheetUpdates: [{name, updates:[{r,c,v,t}]}]
  const zip=await JSZip.loadAsync(origBuf);
  for(const su of sheetUpdates){
    const path=await _xlSheetPath(zip,su.name);
    if(!path){console.warn('Sheet not found:',su.name);continue;}
    let xml=await zip.file(path).async('text');
    for(const u of su.updates)xml=_xlSetCell(xml,u.r,u.c,u.v,u.t||'s');
    zip.file(path,xml);
  }
  return zip.generateAsync({type:'arraybuffer',compression:'DEFLATE',compressionOptions:{level:1}});
}

async function kkdxNavLoad(inp){
  const f=inp.files[0];if(!f)return;
  document.getElementById('kkdx-nnm').textContent=f.name;
  kkdxLog('⏳ Đang đọc file HT...');
  const buf=await f.arrayBuffer();
  _kkdxNavWb=XLSX.read(new Uint8Array(buf),{type:'array'});
  const ws=_kkdxNavWb.Sheets[_kkdxNavWb.SheetNames[0]];
  _kkdxNavRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  // Dòng 6 Excel = index 5 (0-based) là header
  const hdr=_kkdxNavRaw[5]||[];
  const cNg=hdr.findIndex(h=>h&&String(h).trim()==='Ngành');
  if(cNg<0){kkdxLog('❌ Không tìm thấy cột "Ngành" ở dòng 6 của file HT');return;}
  const ngs=new Set();
  for(let r=6;r<_kkdxNavRaw.length;r++){
    const v=(_kkdxNavRaw[r]||[])[cNg];
    if(v&&String(v).trim())ngs.add(String(v).trim());
  }

  const sel=document.getElementById('kkdx-ng');
  if(!sel)return;
  sel.innerHTML=`<option value="">— Chọn ngành —</option>`+sorted.map(n=>`<option value="${_ex(n)}">${n}</option>`).join('');

  kkdxLog(`✓ Đã tải file HT: ${f.name}\n   ${sorted.length} ngành tìm thấy – hãy chọn ngành cần kiểm kê`);
}

async function kkdxRun(){
  if(!_kkdxRawWb){kkdxLog('❌ Chưa chọn file thô');return;}
  if(!_kkdxNavRaw){kkdxLog('❌ Chưa chọn file HT');return;}
  const targetNg=document.getElementById('kkdx-ng')?.value||'';
  if(!targetNg){kkdxLog('❌ Chưa chọn ngành kiểm kê');return;}
  const LOG=['⏳ Đang xử lý...'];kkdxLog(LOG);
  try{
    // [1] Đọc file thô → consolidate theo barcode
    const rawWs=_kkdxRawWb.Sheets['Data'];
    if(!rawWs){LOG.push('❌ File thô không có sheet "Data"');kkdxLog(LOG);return;}
    const rawRows=XLSX.utils.sheet_to_json(rawWs,{defval:null});
    const s0=rawRows[0]||{};
    const keyMa=Object.keys(s0).find(k=>/mavach/i.test(k.replace(/\s/g,'')))||'MaVach';
    const keyQty=Object.keys(s0).find(k=>/soluongkiem/i.test(k.replace(/\s/g,'')))||'SoLuongKiem';
    const actualMap={},bcOrder=[];
    for(const r of rawRows){
      const bc=String(r[keyMa]||'').split('.')[0].trim();
      if(!bc||bc==='null')continue;
      if(!(bc in actualMap))bcOrder.push(bc);
      actualMap[bc]=(actualMap[bc]||0)+(parseFloat(r[keyQty])||0);
    }
    LOG.push(`[1] File thô: ${rawRows.length} dòng → ${bcOrder.length} barcode duy nhất`);kkdxLog(LOG);

    // [2] Parse header file HT (dòng 6 = index 5)
    const hdr=_kkdxNavRaw[5]||[];
    const colOf=name=>{
      let i=hdr.findIndex(h=>h&&String(h).trim()===name);
      if(i>=0)return i;
      return hdr.findIndex(h=>h&&String(h).toLowerCase().includes(name.toLowerCase()));
    };
    const cNg=colOf('Ngành'),cKho=colOf('Kho'),cMaKho=colOf('Mã kho'),cBc=colOf('Barcode');
    const cMaSP=colOf('Mã SP'),cTen=colOf('Tên SP'),cGia=colOf('Giá BL');
    const cAcc=colOf('Accounting Inventory'),cPOS=colOf('Qty On POS Sold Not Posted');
    if(cBc<0||cNg<0){LOG.push('❌ File HT thiếu cột Barcode hoặc Ngành (dòng 6)');kkdxLog(LOG);return;}

    // [3] Tìm store khớp barcode nhiều nhất
    const actualBcs=new Set(bcOrder);
    const storeCnt={},storeKho={};
    for(let r=6;r<_kkdxNavRaw.length;r++){
      const row=_kkdxNavRaw[r]||[];
      const mk=cMaKho>=0?String(row[cMaKho]||'').trim():'';
      if(!mk)continue;
      const bc=String(row[cBc]||'').split('.')[0].trim();
      if(actualBcs.has(bc))storeCnt[mk]=(storeCnt[mk]||0)+1;
      if(!storeKho[mk]&&cKho>=0&&row[cKho])storeKho[mk]=String(row[cKho]).trim();
    }
    let bestStore='',bestCnt=0;
    for(const[s,c]of Object.entries(storeCnt))if(c>bestCnt){bestCnt=c;bestStore=s;}
    const storeName=bestStore?(storeKho[bestStore]||bestStore):'Tất cả kho';
    LOG.push(`[2] Store: ${bestStore||'(auto)'} – ${storeName}  |  Khớp barcode: ${bestCnt}/${actualBcs.size}`);kkdxLog(LOG);

    // [4] Lọc theo Ngành (và store), dedup theo barcode, sắp xếp theo Mã SP
    const seenBc=new Set(),ngRows=[];
    for(let r=6;r<_kkdxNavRaw.length;r++){
      const row=_kkdxNavRaw[r]||[];
      if(bestStore&&cMaKho>=0&&String(row[cMaKho]||'').trim()!==bestStore)continue;
      if(String(row[cNg]||'').trim()!==targetNg)continue;
      const bc=String(row[cBc]||'').split('.')[0].trim();
      if(!bc||seenBc.has(bc))continue;
      seenBc.add(bc);
      ngRows.push({bc,maSP:cMaSP>=0?String(row[cMaSP]||''):'',tenSP:cTen>=0?String(row[cTen]||''):'',gia:cGia>=0?(parseFloat(row[cGia])||0):0,ht:(parseInt(row[cAcc]||0)||0)+(parseInt(row[cPOS]||0)||0)});
    }
    ngRows.sort((a,b)=>a.maSP.localeCompare(b.maSP));
    LOG.push(`[3] Ngành "${targetNg}": ${ngRows.length} mã trong hệ thống`);kkdxLog(LOG);

    // [5] So sánh HT vs TT
    const result=[],tt0=[];
    let nMatch=0,nEqual=0;
    for(const it of ngRows){
      const tt=Math.round(actualMap[it.bc]||0);
      if(it.bc in actualMap)nMatch++;
      const cl=tt-it.ht;
      if(cl===0){nEqual++;continue;}
      (tt===0?tt0:result).push({...it,tt,cl,clTien:cl*it.gia});
    }
    const rows=[...result,...tt0]; // TT=0 cuối danh sách
    LOG.push(`    Đã kiểm: ${nMatch}  |  CL=0: ${nEqual}  |  CL≠0: ${rows.length} (trong đó TT=0: ${tt0.length})`);kkdxLog(LOG);

    // [6] Xuất Excel
    LOG.push('[4] Tạo file kết quả...');kkdxLog(LOG);
    const hdrs=['STT','Ngành','Item No','Barcode','Tên sản phẩm','Giá bán','Tồn HT','Tồn TT','KL2','Chênh lệch','Chênh lệch tiền','Ghi chú'];
    const aoa=[hdrs];
    rows.forEach((r,i)=>aoa.push([i+1,targetNg,r.maSP,r.bc,r.tenSP,r.gia||null,r.ht,r.tt,null,r.cl,r.clTien||null,r.tt===0?'TT=0 (chưa scan)':'']));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[5,18,8,14,50,12,12,11,11,11,16,18].map(w=>({wch:w}));
    ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
    const out=XLSX.utils.book_new();XLSX.utils.book_append_sheet(out,ws,'Báo cáo');
    const buf=XLSX.write(out,{bookType:'xlsx',type:'array'});
    const abbr=NGANH_ABBR[targetNg]||targetNg.slice(0,4);
    const d=new Date();const ds=`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
    const short=storeName.replace(/^(SKK|CVS)\s+/,'');
    const fname=`KL2 ${abbr} ${short} ${ds}.xlsx`.replace(/\s+/g,' ').trim();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=fname;a.click();
    LOG.push(`✅ HOÀN THÀNH!`);
    LOG.push(`   File: ${fname}`);
    LOG.push(`   Báo cáo: ${rows.length} mã CL≠0  |  ${nEqual} mã khớp (đã loại)`);
    LOG.push(`   ⚠ Cột "Ghi chú" = "TT=0 (chưa scan)" → hàng cần tô vàng`);
    kkdxLog(LOG);
  }catch(err){LOG.push(`❌ Lỗi: ${err.message}`);kkdxLog(LOG);}
}

function kktZoneKey(z){
  const m=/^([A-Za-z]+)(\d+)$/.exec((z||'').trim());
  return m?[0,m[1].toUpperCase(),parseInt(m[2])]:[1,(z||''),0];
}
function kktZoneCmp(a,b){
  const ka=kktZoneKey(a),kb=kktZoneKey(b);
  if(ka[0]!==kb[0])return ka[0]-kb[0];
  if(ka[1]<kb[1])return -1;if(ka[1]>kb[1])return 1;
  return ka[2]-kb[2];
}

async function kktRun(){
  if(!_kktRawWb){kktLog('❌ Chưa chọn file thô');return;}
  if(!_kktNavRaw){kktLog('❌ Chưa chọn file HT');return;}
  const LOG=['⏳ Đang xử lý...'];kktLog(LOG);
  try{
    // [1] Đọc file thô: consolidate barcode + zone map
    const rawWs=_kktRawWb.Sheets['Data'];
    if(!rawWs){LOG.push('❌ File thô không có sheet "Data"');kktLog(LOG);return;}
    const rawRows=XLSX.utils.sheet_to_json(rawWs,{defval:null});
    if(!rawRows.length){LOG.push('❌ Sheet "Data" trống');kktLog(LOG);return;}
    const s0=rawRows[0]||{};
    const keyMa=Object.keys(s0).find(k=>/mavach/i.test(k.replace(/\s/g,'')))||'MaVach';
    const keyQty=Object.keys(s0).find(k=>/soluongkiem/i.test(k.replace(/\s/g,'')))||'SoLuongKiem';
    const keyKV=Object.keys(s0).find(k=>/khuvuc/i.test(k.replace(/\s/g,'')))||'KhuVuc';
    if(!(keyKV in s0)&&!rawRows.some(r=>keyKV in r)){LOG.push('❌ File thô thiếu cột "KhuVuc" – hãy dùng file bắn hàng kiểm kê TỔNG');kktLog(LOG);return;}
    const actualMap={},bcOrder=[],zoneQty={};
    for(const r of rawRows){
      const bc=String(r[keyMa]||'').split('.')[0].trim();
      if(!bc||bc==='null')continue;
      const qty=parseFloat(r[keyQty])||0;
      const kv=String(r[keyKV]||'').trim().toUpperCase();
      if(!(bc in actualMap)){actualMap[bc]=0;bcOrder.push(bc);}
      actualMap[bc]+=qty;
      if(!zoneQty[bc])zoneQty[bc]={};
      if(kv)zoneQty[bc][kv]=(zoneQty[bc][kv]||0)+qty;
    }
    // Build zone strings per barcode (sorted A1<A2<B1...)
    const zoneMap={};
    for(const bc of bcOrder){
      const pairs=Object.entries(zoneQty[bc]||{}).sort((a,b)=>kktZoneCmp(a[0],b[0]));
      zoneMap[bc]=pairs.filter(([,q])=>q>0).map(([kv,q])=>`${kv}(${Math.round(q)})`).join(', ');
    }
    LOG.push(`[1] File thô: ${rawRows.length} dòng → ${bcOrder.length} barcode duy nhất`);kktLog(LOG);

    // [2] Parse header file HT — thử nhiều dòng header
    let hdr=[],hdrIdx=5;
    for(const h of[5,0,3,4,6,1,2]){
      const row=_kktNavRaw[h]||[];
      if(row.some(c=>c&&String(c).trim()==='Mã kho')){hdr=row;hdrIdx=h;break;}
    }
    if(!hdr.length){LOG.push('❌ File HT không tìm thấy cột "Mã kho" ở dòng 1–7');kktLog(LOG);return;}
    const colOf=name=>{
      let i=hdr.findIndex(h=>h&&String(h).trim()===name);
      return i>=0?i:hdr.findIndex(h=>h&&String(h).toLowerCase().includes(name.toLowerCase()));
    };
    const cNg=colOf('Ngành'),cKho=colOf('Kho'),cMaKho=colOf('Mã kho'),cBc=colOf('Barcode');
    const cMaSP=colOf('Mã SP'),cTen=colOf('Tên SP'),cGia=colOf('Giá BL');
    const cAcc=colOf('Accounting Inventory'),cPOS=colOf('Qty On POS Sold Not Posted');
    if(cBc<0){LOG.push('❌ File HT thiếu cột "Barcode"');kktLog(LOG);return;}

    // [3] Tìm store khớp barcode nhiều nhất
    const actualBcs=new Set(bcOrder);
    const storeCnt={},storeKho={};
    for(let r=hdrIdx+1;r<_kktNavRaw.length;r++){
      const row=_kktNavRaw[r]||[];
      const mk=cMaKho>=0?String(row[cMaKho]||'').trim():'';
      if(!mk)continue;
      const bc=String(row[cBc]||'').split('.')[0].trim();
      if(actualBcs.has(bc))storeCnt[mk]=(storeCnt[mk]||0)+1;
      if(!storeKho[mk]&&cKho>=0&&row[cKho])storeKho[mk]=String(row[cKho]).trim();
    }
    let bestStore='',bestCnt=0;
    for(const[s,c]of Object.entries(storeCnt))if(c>bestCnt){bestCnt=c;bestStore=s;}
    const storeName=bestStore?(storeKho[bestStore]||bestStore):'Tất cả kho';
    const storeShort=storeName.replace(/^(SKK|CVS|Store JP)\s+/,'');
    if(!bestStore){LOG.push('❌ Không tìm thấy store nào khớp barcode – kiểm tra lại file HT');kktLog(LOG);return;}
    LOG.push(`[2] Store: ${bestStore} – ${storeName}  |  Khớp barcode: ${bestCnt}/${actualBcs.size}`);kktLog(LOG);

    // [4] Lấy toàn bộ mã của store (dedup theo barcode), tính chênh lệch
    const seenBc=new Set(),items=[];
    for(let r=hdrIdx+1;r<_kktNavRaw.length;r++){
      const row=_kktNavRaw[r]||[];
      if(cMaKho>=0&&String(row[cMaKho]||'').trim()!==bestStore)continue;
      const bc=String(row[cBc]||'').split('.')[0].trim();
      if(!bc||seenBc.has(bc))continue;
      seenBc.add(bc);
      const ht=(parseInt(row[cAcc]||0)||0)+(parseInt(row[cPOS]||0)||0);
      items.push({bc,nganh:cNg>=0?String(row[cNg]||''):'',maSP:cMaSP>=0?String(row[cMaSP]||''):'',tenSP:cTen>=0?String(row[cTen]||''):'',gia:cGia>=0?(parseFloat(row[cGia])||0):0,ht});
    }
    LOG.push(`[3] Hệ thống (${bestStore}): ${items.length} mã`);kktLog(LOG);

    // [5] Tính chênh lệch + hàng lạ
    const sysMap={};for(const it of items)sysMap[it.bc]=it;
    const rows=[];
    let nMatch=0,nEqual=0;
    for(const it of items){
      const tt=Math.round(actualMap[it.bc]||0);
      if(it.bc in actualMap)nMatch++;
      if(tt===it.ht){nEqual++;continue;}
      rows.push({...it,tt,extra:false});
    }
    // Barcode kiểm được nhưng không có trong HT store (hàng lạ)
    for(const bc of bcOrder){
      if(sysMap[bc])continue;
      const tt=Math.round(actualMap[bc]||0);
      if(!tt)continue;
      let info={bc,nganh:'',maSP:'',tenSP:'',gia:0};
      if(_kktCatMap&&_kktCatMap[bc])info={...info,..._kktCatMap[bc]};
      rows.push({...info,ht:0,tt,extra:true});
    }
    const nExtra=rows.filter(r=>r.extra).length;
    LOG.push(`    Đã kiểm: ${nMatch}  |  CL=0 (bỏ qua): ${nEqual}  |  CL≠0: ${rows.length-nExtra}  |  Hàng lạ: ${nExtra}`);kktLog(LOG);

    // [6] Sắp xếp: theo khu vực A-Z (khu đầu tiên); KTT cuối
    rows.sort((a,b)=>{
      const za=zoneMap[a.bc]||'',zb=zoneMap[b.bc]||'';
      if(!za&&!zb)return(a.maSP||'').localeCompare(b.maSP||'');
      if(!za)return 1;if(!zb)return -1;
      const fa=za.split(',')[0].split('(')[0].trim();
      const fb=zb.split(',')[0].split('(')[0].trim();
      const cz=kktZoneCmp(fa,fb);
      return cz!==0?cz:(a.maSP||'').localeCompare(b.maSP||'');
    });

    // [7] Xuất Excel
    LOG.push('[4] Tạo file kết quả...');kktLog(LOG);
    const hdrs=['STT','Ngành','Item No','Barcode','Tên sản phẩm','Giá bán','Tồn hệ thống','KL1','KL2','Chênh lệch','Chênh lệch tiền','Khu vực'];
    const aoa=[hdrs];
    rows.forEach((r,i)=>{
      const cl=r.tt-r.ht;
      const kv=zoneMap[r.bc]||(r.tt===0?'KTT':'');
      aoa.push([i+1,r.nganh,r.maSP,r.bc,r.tenSP,r.gia||null,r.ht,r.tt,null,cl,cl*(r.gia||0)||null,kv]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[5,18,8,14,50,12,12,11,11,11,14,24].map(w=>({wch:w}));
    ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
    const out=XLSX.utils.book_new();XLSX.utils.book_append_sheet(out,ws,'Báo cáo');
    const buf=XLSX.write(out,{bookType:'xlsx',type:'array'});
    const d=new Date();const ds=`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
    const fname=`KK tổng ${storeShort} ${ds}.xlsx`.replace(/\s+/g,' ').trim();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=fname;a.click();
    const nKTT=rows.filter(r=>!zoneMap[r.bc]&&r.tt===0).length;
    LOG.push(`✅ HOÀN THÀNH!`);
    LOG.push(`   File: ${fname}`);
    LOG.push(`   Báo cáo: ${rows.length} mã CL≠0  |  Có khu vực: ${rows.length-nKTT}  |  KTT: ${nKTT}  |  Hàng lạ: ${nExtra}`);
    LOG.push(`   ℹ Cột KL2 để trống – điền số đếm lần 2 nếu cần kiểm lại`);
    kktLog(LOG);
  }catch(err){LOG.push(`❌ Lỗi: ${err.message}`);kktLog(LOG);}
}

function nsLog(lines){
  const el=document.getElementById('ns-log');
  if(!el)return;
  el.style.display='block';
  el.innerHTML=lines.map(l=>{
    const c=l.includes('✓')||l.includes('✅')?'ok':l.includes('✗')||l.includes('❌')?'err':l.includes('⚠')?'warn':l.startsWith('═')||l.startsWith('▶')?'head':'';
    return`<div class="log-l ${c}">${l.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

async function nsRun(){
  const inp=document.getElementById('ns-file');
  if(!inp?.files[0]){nsLog(['❌ Chưa chọn file']);return;}
  const file=inp.files[0];
  nsLog(['⏳ Đang đọc file...']);
  const buf=await file.arrayBuffer();
  try{
    const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellNF:true});
    const res=nsProcess(wb,file.name);
    nsLog(res.log);
    if(res.ok){
      // Ghi cell trực tiếp vào workbook rồi write (không dùng cellStyles để tránh lỗi Excel)
      const ws=wb.Sheets[res.ssName];
      for(const u of res.updates){
        const addr=XLSX.utils.encode_cell({r:u.r,c:u.c});
        ws[addr]={v:u.v,t:u.t};
      }
      const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      a.download=file.name.replace(/\.xlsx$/i,'_KetQua.xlsx');
      a.click();
      nsLog([...res.log,'','✅ Đã tải file kết quả về!']);
    }
  }catch(err){nsLog([`❌ Lỗi: ${err.message}`]);}
}

function nsProcess(wb,fname){
  const log=[`▶  ${fname}`];
  const sn=wb.SheetNames;
  const ssName=sn.find(s=>{const l=s.toLowerCase();return l.includes('so')&&l.includes('nh');});
  const navName=sn.find(s=>/^nav$/i.test(s.trim()));
  const smlName=sn.find(s=>/^(sml|hapi)$/i.test(s.trim()));
  if(!ssName||!navName||!smlName)
    return{ok:false,log:[...log,`✗ Thiếu sheet (có: ${sn.join(', ')}) — cần: So sánh + NAV + SML/HAPI`]};

  const dataSS=XLSX.utils.sheet_to_json(wb.Sheets[ssName],{header:1,defval:null,raw:true});
  const header=dataSS[0]||[];
  const findCol=names=>{
    for(const nm of names){
      const i=header.findIndex(h=>h&&String(h).toLowerCase().includes(nm.toLowerCase()));
      if(i>=0)return i;
    }return null;
  };
  const colMaSP=findCol(['mã-sp','ma-sp','mã sp','ma sp']);
  const colSS=findCol(['ss']);
  const colLyDo=findCol(['lý do','ly do']);
  if(colMaSP===null||colLyDo===null)
    return{ok:false,log:[...log,'✗ Không tìm được cột Mã SP hoặc Lý do trong sheet So sánh']};

  const items=[];
  for(let r=1;r<dataSS.length;r++){
    const row=dataSS[r]||[];
    const ma=String(row[colMaSP]??'').trim();
    if(!ma||ma==='null'||ma==='undefined')continue;
    items.push({rowIdx:r+1,maSP:ma,ssQty:colSS!==null&&row[colSS]!=null?parseFloat(row[colSS])||0:0});
  }
  const maSet=new Set(items.map(i=>i.maSP));
  log.push(`   Sheet SS: ${items.length} mã, ${items.filter(i=>i.ssQty!==0).length} có lệch`);

  const dataN=XLSX.utils.sheet_to_json(wb.Sheets[navName],{header:1,defval:null,raw:true});
  const navHdr=(dataN[0]||[]).map(v=>String(v??'').trim().toLowerCase());
  const nCol=kws=>{for(const k of kws){const i=navHdr.findIndex(h=>h.includes(k));if(i>=0)return i;}return null;};
  const niMa=nCol(['mã hàng','ma hang','mã sp','ma sp'])??3;
  const niQty=nCol(['số lượng','so luong'])??6;
  const niOrd=nCol(['mã số nhận','ma so nhan','chứng từ','đơn đặt hàng'])??2;
  const navData={};
  for(let r=1;r<dataN.length;r++){
    const row=dataN[r]||[];
    const ma=String(row[niMa]??'').trim();
    if(!maSet.has(ma))continue;
    const ord=String(row[niOrd]??'').trim();
    if(!navData[ma])navData[ma]={};
    navData[ma][ord]=(navData[ma][ord]||0)+(parseFloat(row[niQty])||0);
  }

  const dataS=XLSX.utils.sheet_to_json(wb.Sheets[smlName],{header:1,defval:null,raw:true});
  const smlData={};
  for(let r=1;r<dataS.length;r++){
    const row=dataS[r]||[];
    const ma=String(row[2]??'').trim();
    if(!maSet.has(ma))continue;
    const ord=String(row[6]??'').trim();
    const qty=parseFloat(row[4])||0;
    const sign=String(row[7]??'').includes('Xuất')?-1:1;
    if(!smlData[ma])smlData[ma]={};
    smlData[ma][ord]=(smlData[ma][ord]||0)+sign*qty;
  }

  const genLyDo=(ma,ssQty)=>{
    if(ssQty===0)return'';
    const navRaw=navData[ma]||{};
    const smlRaw=smlData[ma]||{};
    const navOrd=Object.fromEntries(Object.entries(navRaw).filter(([,v])=>Math.abs(v)>0.001));
    const navZero=new Set(Object.keys(navRaw).filter(k=>Math.abs(navRaw[k])<=0.001));
    const smlOrd=Object.fromEntries(Object.entries(smlRaw).filter(([,v])=>Math.abs(v)>0.001));
    const all=new Set([...Object.keys(navOrd),...Object.keys(smlOrd),...navZero]);
    const reasons=[];
    for(const ord of [...all].sort()){
      if(!ord)continue;
      const nq=navOrd[ord],sq=smlOrd[ord],iz=navZero.has(ord);
      if(iz&&sq!=null)reasons.push(`NAV có chứng từ ${sq<0?'nhập':'xuất'} ${ord} (${Math.round(Math.abs(sq))} sp) nhưng Hapi không có`);
      else if(nq==null&&!iz&&sq!=null)reasons.push(`Hapi ${sq>0?'nhập':'xuất'} đơn ${ord} (${Math.round(Math.abs(sq))} sp) nhưng NAV không có chứng từ`);
      else if(nq!=null&&sq==null)reasons.push(`NAV có chứng từ ${nq>0?'nhập':'xuất'} ${ord} (${Math.round(Math.abs(nq))} sp) nhưng Hapi không có`);
      else if(nq!=null&&sq!=null){
        const df=Math.abs(sq)-Math.abs(nq);
        if(Math.abs(df)>0.001)reasons.push(`Đơn ${ord} lệch: NAV=${Math.round(Math.abs(nq))} sp, Hapi=${Math.round(Math.abs(sq))} sp (${df>0?'Hapi':'NAV'} hơn ${Math.round(Math.abs(df))} sp)`);
      }
    }
    return reasons.length?reasons.join('; '):`Lệch ${Math.round(Math.abs(ssQty))} sp – chưa xác định được chứng từ cụ thể`;
  };

  const updates=[];
  let lech=0,khop=0;
  for(const item of items){
    const ld=genLyDo(item.maSP,item.ssQty);
    updates.push({r:item.rowIdx-1,c:colLyDo,v:ld,t:'s'});
    if(item.ssQty!==0)lech++;else khop++;
  }
  log.push(`   ✓ ${khop} mã khớp  |  ${lech} mã lệch`,'═══ HOÀN THÀNH ═══');
  return{ok:true,log,ssName,updates};
}

function bbLog(lines){
  const el=document.getElementById('bbkk-log');
  if(!el)return;
  el.style.display='block';
  el.innerHTML=lines.map(l=>{
    const c=l.includes('✓')||l.includes('✅')?'ok':l.includes('✗')||l.includes('❌')?'err':l.includes('⚠')?'warn':l.startsWith('═')||l.startsWith('▶')?'head':'';
    return`<div class="log-l ${c}">${l.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

async function bbkkRun(){
  const inpD=document.getElementById('bbkk-dmhh');
  const inpF=document.getElementById('bbkk-file');
  if(!inpD?.files[0]||!inpF?.files[0]){bbLog(['❌ Cần chọn đủ 2 file: DMHH và BBKK']);return;}
  const LOG=['⏳ Đang đọc file... [v20260626-7]'];bbLog(LOG);
  try{
    const [bufD,bufFRaw]=await Promise.all([inpD.files[0].arrayBuffer(),inpF.files[0].arrayBuffer()]);
    const wbD=XLSX.read(new Uint8Array(bufD),{type:'array'});
    const wbF=XLSX.read(new Uint8Array(bufFRaw),{type:'array'});
    const res=bbkkProcess(wbD,wbF,inpF.files[0].name);
    for(const l of res.log){LOG.push(l);}bbLog(LOG);
    if(res.ok){
      LOG.push(`📋 Ghi ${res.bbUpdates.length} cell → JSZip patch file gốc...`);bbLog(LOG);
      const sheets=[{name:res.bbName,updates:res.bbUpdates}];
      if(res.dxName&&res.dxUpdates.length)sheets.push({name:res.dxName,updates:res.dxUpdates});
      let out;
      try{out=await _xlApply(bufFRaw,sheets);}
      catch(we){LOG.push(`❌ Lỗi ghi file: ${we.message}`);bbLog(LOG);return;}
      LOG.push(`✅ ${(out.byteLength/1024).toFixed(0)} KB — Đang tải về...`);bbLog(LOG);
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      a.download=inpF.files[0].name.replace(/\.xlsx$/i,'_ketqua.xlsx');
      a.click();
      LOG.push('✅ Đã tải file kết quả về!');bbLog(LOG);
    }
  }catch(err){LOG.push(`❌ Lỗi: ${err.message}`);bbLog(LOG);}
}

function bbkkProcess(wbD,wbF,fname){
  const log=[`▶  ${fname}`];
  // ── Nạp DMHH ──────────────────────────────────────────────
  const snD=wbD.SheetNames;
  if(snD.length<2)return{ok:false,log:[...log,'❌ File DMHH cần ít nhất 2 sheet (HT và KHT)']};
  const readDM=(sn,skipRows)=>{
    const raw=XLSX.utils.sheet_to_json(wbD.Sheets[sn],{header:1,defval:null,raw:true});
    const hdr=raw[skipRows]||[];
    const cMa=hdr.findIndex(h=>h&&/mã hàng|ma hang/i.test(String(h)));
    const cTen=hdr.findIndex(h=>h&&/tên sp|ten sp|tên hàng|ten hang/i.test(String(h)));
    const cNh=hdr.findIndex(h=>h&&/nhóm|nhom/i.test(String(h)));
    const maSet=new Set(),maToTen={},maToNganh={};
    for(let r=skipRows+1;r<raw.length;r++){
      const row=raw[r]||[];
      if(cMa<0||row[cMa]==null)continue;
      const ma=String(Math.round(parseFloat(row[cMa]))||'').trim();
      if(!ma||ma==='NaN'||ma==='0')continue;
      maSet.add(ma);
      if(cTen>=0&&row[cTen])maToTen[ma]=String(row[cTen]);
      if(cNh>=0&&row[cNh])maToNganh[ma]=String(row[cNh]);
    }
    return{maSet,maToTen,maToNganh};
  };
  const dm0=readDM(snD[0],4);
  const dm1=readDM(snD[1],0);
  const maHT=dm0.maSet,maKHT=dm1.maSet;
  const maToTen={...dm0.maToTen,...dm1.maToTen};
  const maToNganh={...dm0.maToNganh,...dm1.maToNganh};
  log.push(`   DMHH: HT ${maHT.size} mã | KHT ${maKHT.size} mã`);
  const lookup=m=>maKHT.has(m)?'Không hỗ trợ':maHT.has(m)?'Hỗ trợ':'Không tìm thấy';

  // ── Nạp BBKK ──────────────────────────────────────────────
  const bbName=wbF.SheetNames.find(s=>/bbkk/i.test(s))||wbF.SheetNames[0];
  if(!bbName)return{ok:false,log:[...log,'❌ Không tìm thấy sheet BBKK']};
  const rawBB=XLSX.utils.sheet_to_json(wbF.Sheets[bbName],{header:1,defval:null,raw:true});
  const data=[];
  for(let r=8;r<rawBB.length;r++){
    const row=rawBB[r]||[];
    if(row[2]==null)continue;
    const ma=String(Math.round(parseFloat(row[2]))||'').trim();
    if(!ma||ma==='NaN'||ma==='0')continue;
    const tgt=parseFloat(row[11])||0,tgth=parseFloat(row[13])||0;
    data.push({
      origRow:r,excelRow:r+1,
      LoaiHang:String(row[1]||'').trim().toUpperCase(),MaSP:ma,
      Barcode:String(row[3]||'').split('.')[0],
      TenSP:String(row[4]||''),
      TGthua:tgt,TGthieu:tgth,CL_net:tgt+tgth,
      LyDo:String(row[14]||''),
      HoTro:lookup(ma)
    });
  }
  log.push(`   BBKK: ${data.length} dòng`);
  const bc2ma={};
  data.forEach(d=>{if(d.Barcode&&d.Barcode!=='null'&&d.Barcode!=='nan'&&d.Barcode!=='0')bc2ma[d.Barcode]=d.MaSP;});

  // ── Nhầm mã ───────────────────────────────────────────────
  const kiemTraNham=(maSP,tenSP,lyDo)=>{
    if(!lyDo||lyDo==='null')return{hopLe:null};
    const ld=lyDo.trim();
    const hasKw=/nhầm|bán nhầm|nhầm mã/i.test(ld);
    const codeOnly=/^[\d\s,;/.\-]+(sl\s*\d+)?$/i.test(ld)&&/\d{5,}/.test(ld);
    if(!hasKw&&!codeOnly)return{hopLe:null};
    const maDois=[...new Set((ld.match(/\b(\d{5,6})\b/g)||[]))];
    (ld.match(/\b(\d{8,14})\b/g)||[]).forEach(bc=>{const mp=bc2ma[bc];if(mp&&!maDois.includes(mp))maDois.push(mp);});
    if(!maDois.length)return{hopLe:null};
    const bad=maDois.filter(md=>{
      const tenDu=maToTen[md]||'';
      const ng1=maToNganh[maSP]||'',ng2=maToNganh[md]||'';
      const chung=[...tenSP.toLowerCase().split(/\s+/)].filter(w=>w.length>1&&tenDu.toLowerCase().includes(w));
      return!(ng1&&ng1===ng2)&&chung.length<2;
    });
    return bad.length?{hopLe:false,moTa:`Mã đối: ${bad.join(',')} không cùng ngành`}:{hopLe:true};
  };

  const nhamMap={};
  let nHL=0,nKHL=0;
  const warnLines=[];
  for(const d of data){
    const res=kiemTraNham(d.MaSP,d.TenSP,d.LyDo);
    nhamMap[d.origRow]=res;
    if(res.hopLe===true){nHL++;}
    if(res.hopLe===false){nKHL++;if(d.HoTro==='Không hỗ trợ')warnLines.push(`   ${d.MaSP} '${d.TenSP.slice(0,30)}' → ${res.moTa||''}`);}
  }

  const ht=data.filter(d=>d.HoTro==='Hỗ trợ');
  const kht=data.filter(d=>d.HoTro==='Không hỗ trợ');
  const ntf=data.filter(d=>d.HoTro==='Không tìm thấy');
  const htNet=ht.reduce((s,d)=>s+d.CL_net,0);
  const khtNet=kht.reduce((s,d)=>s+d.CL_net,0);
  const tongCL=htNet+khtNet;
  log.push(`   HT: ${ht.length} mã (${vfmt(htNet)}đ) | KHT: ${kht.length} mã (${vfmt(khtNet)}đ) | NTF: ${ntf.length}`);
  log.push(`   Tổng CL: ${vfmt(tongCL)}đ`);
  if(warnLines.length){log.push(`   ⚠ ${nKHL} dòng nhầm mã không hợp lệ:`);warnLines.slice(0,8).forEach(l=>log.push(l));}
  else if(nHL>0)log.push(`   ✓ ${nHL} dòng nhầm mã hợp lệ`);

  // ── Đền bù pool ───────────────────────────────────────────
  const poolRows=[];
  for(const d of kht){
    const{hopLe}=nhamMap[d.origRow]||{};
    if(hopLe===true){
      const paired=(d.LyDo.match(/\b(\d{5,6})\b/g)||[]);
      (d.LyDo.match(/\b(\d{8,14})\b/g)||[]).forEach(bc=>{const mp=bc2ma[bc];if(mp&&!paired.includes(mp))paired.push(mp);});
      if(!paired.some(pm=>lookup(pm)!=='Hỗ trợ'))continue;
    }
    poolRows.push(d);
  }
  const catNet={};
  for(const d of poolRows)catNet[d.LoaiHang]=(catNet[d.LoaiHang]||0)+d.CL_net;
  const bdSeries=Object.entries(catNet).filter(([,v])=>v<0).sort(([,a],[,b])=>a-b);
  const denBuTong=bdSeries.reduce((s,[,v])=>s+Math.abs(v),0);
  if(bdSeries.length){
    log.push('   Loại Hàng KHT cần đền bù:');
    bdSeries.forEach(([lh,v])=>log.push(`      ${lh}: ${vfmt(v)}đ → ĐB: ${vfmt(Math.abs(v))}đ`));
  }
  log.push(`   → Tổng gợi ý đền bù: ${vfmt(denBuTong)}đ`);

  // ── Build update lists (không chỉnh workbook — dùng JSZip để write) ──
  const bbUpdates=[];
  // Header dòng 6 (index 5)
  ['Check','Nhầm mã','Đề xuất ĐB'].forEach((v,i)=>bbUpdates.push({r:5,c:16+i,v,t:'s'}));
  for(const d of data){
    const er=d.excelRow-1;
    bbUpdates.push({r:er,c:16,v:d.HoTro,t:'s'});
    const{hopLe}=nhamMap[d.origRow]||{};
    if(hopLe===true)bbUpdates.push({r:er,c:17,v:'✓ Hợp lệ',t:'s'});
    else if(hopLe===false)bbUpdates.push({r:er,c:17,v:'✗ Không hợp lệ',t:'s'});
    if(d.HoTro==='Không hỗ trợ'&&d.CL_net<0)bbUpdates.push({r:er,c:18,v:Math.abs(d.CL_net),t:'n'});
  }

  // ── Đề xuất sheet ──────────────────────────────────────────────
  const dxName=wbF.SheetNames.find(s=>s.trim()==='Đề xuất');
  const dxUpdates=[];
  if(dxName){
    // reason_tag cho từng Loại Hàng trong pool KHT âm
    const khtAmPool=poolRows.filter(d=>d.CL_net<0);
    const reasonTag=lh=>{
      const grp=khtAmPool.filter(d=>d.LoaiHang===lh);
      const tags=[];
      if(grp.some(d=>/không rõ|chưa rõ/i.test(d.LyDo)))tags.push('không rõ NN');
      const khl=grp.filter(d=>nhamMap[d.origRow]?.hopLe===false);
      if(khl.length)tags.push(`bán nhầm KHL(${khl.length})`);
      const hl=grp.filter(d=>nhamMap[d.origRow]?.hopLe===true);
      if(hl.length)tags.push(`bán nhầm HL(${hl.length}), NET âm`);
      return tags.join(' | ');
    };
    const caseNote=tongCL>=0
      ?`CL DƯƠNG (${vfmt(tongCL)}đ) — KHT dương bù âm trong cùng loại hàng`
      :Math.abs(tongCL)>=Math.abs(khtNet)
        ?`CL ÂM (${vfmt(tongCL)}đ) — Cân nhắc đền bù 100% tổng CL`
        :`KHT âm (${vfmt(khtNet)}đ) lớn hơn tổng CL — Sàn đền bù tối thiểu = |KHT|`;
    const nhamSummary=nHL||nKHL?`Nhầm mã: ${nHL} hợp lệ${nKHL?' / '+nKHL+' KHÔNG hợp lệ':''}`:'';
    const ksclText=`[KSCL KIỂM TRA]\nHT: ${vfmt(htNet)}đ | KHT: ${vfmt(khtNet)}đ | Tổng CL: ${vfmt(tongCL)}đ\nLoại Hàng KHT có NET âm cần đền bù:\n${bdSeries.map(([l,v])=>{const tag=reasonTag(l);return`  ${l}: ${vfmt(v)}đ → Đền bù: ${vfmt(Math.abs(v))}đ`+(tag?`  [${tag}]`:'');}).join('\n')||'  (Không có)'}\n→ TỔNG GỢI Ý ĐỀN BÙ: ${vfmt(denBuTong)}đ\n${caseNote}${nhamSummary?'\n'+nhamSummary:''}`;
    const rawDX=XLSX.utils.sheet_to_json(wbF.Sheets[dxName],{header:1,defval:null,raw:true});
    let chkR=-1,chkC=-1;
    for(let r=0;r<Math.min(rawDX.length,20)&&chkR<0;r++){
      const row=rawDX[r]||[];
      for(let c=0;c<row.length;c++){
        if(String(row[c]||'').trim().toLowerCase()==='check'){chkR=r;chkC=c;break;}
      }
    }
    if(chkR>=0){
      dxUpdates.push({r:chkR+1,c:chkC,v:ksclText,t:'s'});
      log.push(`   ✓ Ghi KSCL vào ô Check (dòng ${chkR+2}, cột ${_xlCol(chkC)})`);
    } else {
      let tongR=-1;
      for(let r=0;r<rawDX.length;r++){
        if((rawDX[r]||[]).some(c=>/^tổng$|^tong$/i.test(String(c||'').trim()))){tongR=r;break;}
      }
      const insR=tongR>=0?tongR+1:(XLSX.utils.decode_range(wbF.Sheets[dxName]['!ref']||'A1').e.r+2);
      dxUpdates.push({r:insR,c:0,v:ksclText,t:'s'});
      log.push(`   ✓ Ghi KSCL vào Đề xuất (dòng ${insR+1})`);
    }
  }

  if(ntf.length){
    log.push(`   ⚠ ${ntf.length} mã không có trong DMHH`);
    ntf.slice(0,5).forEach(d=>log.push(`      ${d.MaSP}  ${d.TenSP.slice(0,50)}`));
  }
  log.push('═══ HOÀN THÀNH ═══');
  return{ok:true,log,bbName,bbUpdates,dxName:dxName||null,dxUpdates};
}

function vfmt(n){return(Math.round(n)||0).toLocaleString('vi-VN');}
